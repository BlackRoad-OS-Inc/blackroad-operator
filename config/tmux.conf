# ═══════════════════════════════════════════════════════════════
# BlackRoad OS - Tmux Configuration
# Font: JetBrains Mono
# Colors: #FF9D00 → #FF6B00 → #FF0066 → #D609AA → #7700FF → #0866FF
# ═══════════════════════════════════════════════════════════════

# Enable 256 color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable mouse support
set -g mouse on

# Status bar styling (BlackRoad colors)
set -g status-style "bg=colour17,fg=colour214"  # Navy background, Orange foreground
set -g status-left-length 50
set -g status-right-length 100

# Status bar content
set -g status-left "#[fg=colour17,bg=colour214,bold] 🚗 blackroad #[default] "
set -g status-right "#[fg=colour17,bg=colour33,bold] %H:%M:%S #[default] #[fg=colour17,bg=colour165,bold] #S #[default]"
set -g status-interval 1

# Window status styling
set -g window-status-format "#[fg=colour214] #I:#W "
set -g window-status-current-format "#[fg=colour17,bg=colour199,bold] #I:#W #[default]"

# Pane border colors (gradient)
set -g pane-border-style "fg=colour33"           # Blue
set -g pane-active-border-style "fg=colour214"   # Orange

# Message styling
set -g message-style "bg=colour165,fg=colour17,bold"  # Magenta bg, Navy text

# Copy mode styling
set -g mode-style "bg=colour93,fg=colour17"  # Purple bg

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Enable activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Aggressive resize
setw -g aggressive-resize on

# Key bindings
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Better split commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Easy pane navigation
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ═══════════════════════════════════════════════════════════════
# Note: Font must be set in your terminal emulator (iTerm2, etc.)
# Recommended: JetBrains Mono Nerd Font
# Size: 11-13pt for optimal readability
# ═══════════════════════════════════════════════════════════════
