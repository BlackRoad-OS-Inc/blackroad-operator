# ============================================================
# Cloudflare
# ============================================================
cloudflare:
  account_id: "848cf0b18d51e0170e0d1537aec3505a"

  domains:
    - zone: blackroad.io
      registrar: cloudflare
      subdomains:
        - name: "@"
          purpose: Main platform / landing
        - name: www
          purpose: Redirect to blackroad.io
        - name: api
          purpose: REST API service
        - name: core
          purpose: Core OS service
        - name: operator
          purpose: Operator CLI service
        - name: pay
          purpose: Payment gateway (Stripe)
        - name: payments
          purpose: Payment gateway alias
        - name: cmd
          purpose: Command interface
        - name: tools
          purpose: Tool scripts
        - name: agents
          purpose: Agent system
        - name: prism
          purpose: Prism console
        - name: mesh
          purpose: Network mesh
        - name: hub
          purpose: Central hub
        - name: jobs
          purpose: Job queue
        - name: dashboard
          purpose: Dashboard app
        - name: ai
          purpose: AI services
        - name: storage
          purpose: Object storage (MinIO)
        - name: docs
          purpose: Documentation site
        - name: auth
          purpose: Authentication
        - name: worlds
          purpose: Worlds/metaverse
        - name: "*"
          purpose: Wildcard catch-all

    - zone: blackroad.systems
      registrar: cloudflare
      purpose: System services / infrastructure

    - zone: blackroad.ai
      registrar: cloudflare
      subdomains:
        - name: agent
          purpose: Agent API
        - name: api
          purpose: AI API

  tunnel:
    id: "52915859-da18-4aa6-add5-7bd9fcac2e0b"
    name: blackroad
    host: blackroad-pi

  r2_buckets:
    - name: blackroad-models
      size: 135GB
      purpose: Local LLM model storage

  kv_namespaces:
    - id: "b6c3379f5951468b99ec33264b9dd6dd"
      purpose: Email inbox routing

  workers:
    count: 75+
    key_workers:
      - name: auth
        config: workers/auth/wrangler.toml
        purpose: Token revocation + auth
      - name: email
        config: workers/email/wrangler.toml
        purpose: Email routing (*@blackroad.io)
      - name: copilot
        config: workers/copilot/
        purpose: AI copilot worker

  pages_projects: 10+

# ============================================================
# Stripe
# ============================================================
stripe:
  account_id: "acct_1S70Zn3e5FMFdlFw"
  config: integrations/stripe/stripe-config.ts

  products:
    - id: prod_blackroad_os_pro
      name: BlackRoad OS Pro
      price: $49/mo
      features: 30K agent coordination minutes

    - id: prod_blackroad_os_enterprise
      name: BlackRoad OS Enterprise
      price: $299/mo
      features: Unlimited agents, 99.9% SLA

    - id: prod_agent_credits
      name: Agent Credits
      price: $10/pack
      features: 1K agent-minutes per pack

    - id: prod_blackroad_api
      name: API Access
      price: $99/mo
      features: 100K requests/month

  webhooks:
    - checkout.session.completed
    - customer.subscription.created
    - customer.subscription.updated
    - customer.subscription.deleted
    - invoice.paid
    - invoice.payment_failed
    - payment_intent.succeeded
    - payment_intent.failed

  # Secret env vars (in .env only):
  # STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET
  # STRIPE_PRICE_PRO_MONTHLY, STRIPE_PRICE_ENTERPRISE_MONTHLY
  # STRIPE_PRICE_CREDITS, STRIPE_PRICE_API_MONTHLY

# ============================================================
# Clerk
# ============================================================
clerk:
  config: integrations/clerk/clerk-config.ts

  organizations:
    - slug: blackroad-os-inc
      max_members: 100
      roles: [admin, billing, agent-management, all-orgs-access]

    - slug: blackroad-os
      max_members: 500
      roles: [platform, agents, CLI, deploy, memory, collaboration]

    - slug: blackroad-ai
      max_members: 50
      roles: [models, inference, training, GPU access]

    - slug: blackroad-cloud
      max_members: 50
      roles: [infrastructure, orchestration, networking]

    - slug: blackroad-security
      max_members: 30
      roles: [scanning, audit, compliance, WAF, IDS]

  sso_providers: [google, github, microsoft, apple, saml]
  mfa: enabled

  user_metadata:
    - blackroad_tier
    - agent_limit
    - stripe_customer_id
    - org_ids
    - api_key_hash
    - last_deploy_at
    - credits_balance
    - preferred_model
    - cece_identity_hash

  webhooks:
    - user.created
    - user.updated
    - user.deleted
    - organization.created
    - organization.updated
    - organizationMembership.created
    - organizationMembership.deleted
    - session.created
    - session.ended

  routes:
    sign_in: /sign-in
    sign_up: /sign-up
    after_sign_in: /dashboard
    after_sign_up: /onboarding

  # Secret env vars (in .env only):
  # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY, CLERK_WEBHOOK_SECRET

