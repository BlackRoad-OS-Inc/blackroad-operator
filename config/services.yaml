    host: 10.10.0.2
    port: 6379
    name: Cecilia
    # Secret: REDIS_URL

  storage:
    type: minio
    host: 10.10.0.3
    port: 9000
    name: Lucidia
    # Secret: MINIO_ACCESS_KEY, MINIO_SECRET_KEY

  pi_fleet:
