# ============================================================
# AI Providers (all via tokenless gateway)
# ============================================================
ai_providers:
  gateway: http://127.0.0.1:8787
  providers:
    - name: ollama
      config: blackroad-core/gateway/providers/ollama.js
      local: true
    - name: anthropic
      config: blackroad-core/gateway/providers/anthropic.js
      env: ANTHROPIC_API_KEY
    - name: openai
      config: blackroad-core/gateway/providers/openai.js
      env: OPENAI_API_KEY
    - name: gemini
      config: blackroad-core/gateway/providers/gemini.js
      env: GOOGLE_AI_API_KEY
    - name: grok
      config: integrations/grok/config.yaml
      env: XAI_API_KEY
    - name: huggingface
      config: integrations/huggingface/config.yaml
      env: HUGGINGFACE_TOKEN

