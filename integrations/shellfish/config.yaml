# Shellfish — BlackRoad OS Integration
# iOS SSH/SFTP client
#
# VAULT NOTE: All connection hosts are sensitive infrastructure endpoints.
# Real IPs and credentials are stored in the BlackRoad vault
# (~/.blackroad/vault/) and injected at runtime via environment variables.
# Do NOT commit actual IPs or hostnames to version control.

name: shellfish
category: mobile-tools
status: active

platform: ios
app_store: Shellfish — SSH/SFTP

capabilities:
  - ssh_terminal
  - sftp_file_transfer
  - port_forwarding
  - key_management
  - files_app_integration
  - shortcuts_automation

connections:
  - name: blackroad-pi
    host: ${SHELLFISH_HOST_BLACKROAD_PI}
    user: pi
    auth: ssh_key
    group: raspberry-pi

  - name: aria64
    host: ${SHELLFISH_HOST_ARIA64}
    user: pi
    auth: ssh_key
    group: raspberry-pi

  - name: alice-pi
    host: ${SHELLFISH_HOST_ALICE_PI}
    user: alice
    auth: ssh_key
    group: raspberry-pi

  - name: infinity-droplet
    host: ${SHELLFISH_HOST_INFINITY_DROPLET}
    user: root
    auth: ssh_key
    group: digitalocean

shortcuts:
  - name: SSH BlackRoad Pi
    action: connect
    host: blackroad-pi
  - name: Deploy to Fleet
    action: run_command
    host: blackroad-pi
    command: ./pi-deploy/deploy-to-pis.sh
  - name: Check Ollama
    action: run_command
    host: blackroad-pi
    command: curl -s http://localhost:11434/api/tags

notes: |
  Shellfish provides native iOS SSH access to the entire fleet.
  SFTP enables direct file management from iPhone/iPad.
  Integrates with iOS Files app for seamless file transfer.
  Shortcuts enable automated SSH operations.

  Environment variables required (set once in vault or shell profile):
    SHELLFISH_HOST_BLACKROAD_PI   — primary Pi host
    SHELLFISH_HOST_ARIA64         — aria agent Pi host
    SHELLFISH_HOST_ALICE_PI       — alice agent Pi host
    SHELLFISH_HOST_INFINITY_DROPLET — DigitalOcean droplet host
