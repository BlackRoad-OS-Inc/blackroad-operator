version: 0.1
default: blackroad-core

brains:

  blackroad-core:
    model: blackroad-phi
    tier: internal
    description: >
      Core BlackRoad reasoning engine.
      Deterministic, minimal, replaceable.
    constraints:
      - no roleplay
      - no speculation
      - concise output

  blackroad-proprietary:
    model: blackroad-proprietary
    tier: proprietary
    description: >
      Proprietary BlackRoad governance layer.
    constraints:
      - confidential behavior
      - audit-safe language
      - deterministic

  blackroad-operator:
    model: blackroad-operator
    tier: ops
    description: >
      Infrastructure and command orchestration.
    constraints:
      - terminal-safe
      - actionable only
      - no emojis

  blackroad-analyst:
    model: blackroad-analyst
    tier: analysis
    description: >
      Structured reasoning and risk analysis.
    constraints:
      - bullet points
      - explicit assumptions

  blackroad-enterprise:
    model: blackroad-enterprise
    tier: enterprise
    description: >
      Compliance-focused enterprise reasoning.
    constraints:
      - conservative tone
      - explicit uncertainty
      - audit-friendly

  blackroad-sentinel:
    model: blackroad-sentinel
    tier: security

  blackroad-auditor:
