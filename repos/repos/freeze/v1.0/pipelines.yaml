version: 0.1

pipelines:

  safe-command:
    description: >
      Route a user request into a safe, gated command.
    steps:
      - agent: blackroad-router
        output: route

      - agent: ${route}
        output: draft

      - agent: blackroad-sentinel
        input: ${draft}
        output: safety

      - agent: blackroad-gatekeeper
        input: ${safety}
        decision: allow

      - when: allow == "ALLOW"
        agent: blackroad-command
        input: ${draft}
        output: command

      - when: allow != "ALLOW"
        agent: blackroad-explainer
        input: ${safety}
        output: explanation

  analysis-decision:
    description: >
      Multi-agent analysis with synthesis.
    steps:
      - agent: blackroad-planner
        output: plan

      - agent: blackroad-research
        input: ${plan}
        output: research

      - agent: blackroad-analyst
        input: ${research}
        output: analysis

      - agent: blackroad-synthesizer
        input:
          - ${plan}
          - ${analysis}
        output: decision
