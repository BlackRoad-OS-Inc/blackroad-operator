# RoadWay nginx reverse proxy template
# Add this to your nginx config to route *.roadway.blackroad.io to containers
#
# Generate per-app blocks with: roadway nginx-conf
# Or use this wildcard approach:

# Wildcard DNS: *.roadway.blackroad.io → this server

# RoadWay API + Dashboard
server {
    listen 80;
    server_name roadway.blackroad.io;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Dynamic app routing — reads app name from subdomain, proxies to container port
