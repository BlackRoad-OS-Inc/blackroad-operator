<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --green: #00FF41;
  --green-dim: #00AA2A;
  --green-dark: #004D1A;
  --cyan: #00D4FF;
  --bg: #000000;
  --bar-bg: #0A0A0A;
  --border: #1A1A1A;
  --error: #FF2255;
  --amber: #F5A623;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--green);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 1.5;
}

/* CRT scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.15) 2px,
    rgba(0, 0, 0, 0.15) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* CRT flicker */
@keyframes crtFlicker {
  0%, 100% { opacity: 1; }
  92% { opacity: 1; }
  93% { opacity: 0.96; }
  94% { opacity: 1; }
}

body {
  animation: crtFlicker 4s infinite;
}

/* Top bar */
#topbar {
  height: 36px;
  background: var(--bar-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  font-size: 12px;
  user-select: none;
  flex-shrink: 0;
}

#topbar .brand {
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #FF6B2B, #FF2255, #CC00AA, #8844FF, #4488FF, #00D4FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#topbar .indicators {
  display: flex;
  align-items: center;
  gap: 20px;
  color: var(--green-dim);
}

#topbar .indicator {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Terminal container */
#terminal-wrap {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 36px);
}

#output {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--green-dark) transparent;
}

#output::-webkit-scrollbar { width: 6px; }
#output::-webkit-scrollbar-track { background: transparent; }
#output::-webkit-scrollbar-thumb { background: var(--green-dark); border-radius: 3px; }

.line { white-space: pre-wrap; word-break: break-all; min-height: 1.5em; }
.line.boot { color: var(--green-dim); }
.line.boot .tag { color: var(--amber); }
.line.boot .ok { color: var(--green); font-weight: 700; }
.line.error { color: var(--error); }
.line.cyan { color: var(--cyan); }
.line.dim { color: var(--green-dim); }
.line.gradient {
  background: linear-gradient(90deg, #FF6B2B, #FF2255, #CC00AA, #8844FF, #4488FF, #00D4FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.line .highlight { color: #fff; }
.line .green { color: var(--green); }
.line .cyan { color: var(--cyan); }
.line .amber { color: var(--amber); }
.line .red { color: var(--error); }
.line .dim { color: var(--green-dim); }
.line .bold { font-weight: 700; }
.line .glow {
  text-shadow: 0 0 8px var(--green), 0 0 16px rgba(0, 255, 65, 0.3);
}

/* Input area */
#input-area {
  padding: 8px 16px 16px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

#prompt-label {
  color: var(--cyan);
  font-weight: 500;
  margin-right: 8px;
  white-space: nowrap;
  text-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
}

#input-wrapper {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

#cmd-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--green);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 1.5;
  caret-color: transparent;
  text-shadow: 0 0 6px rgba(0, 255, 65, 0.3);
}

#cursor {
  display: inline-block;
  width: 8px;
  height: 18px;
  background: var(--green);
  animation: blink 1s step-end infinite;
  position: absolute;
  left: 0;
  box-shadow: 0 0 8px var(--green);
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Tab completion dropdown */
#autocomplete {
  display: none;
  position: fixed;
  background: #0A0A0A;
  border: 1px solid var(--green-dark);
  padding: 4px 0;
  z-index: 1000;
  max-height: 200px;
  overflow-y: auto;
  min-width: 200px;
}

#autocomplete .ac-item {
  padding: 2px 12px;
  cursor: pointer;
  color: var(--green-dim);
}

#autocomplete .ac-item.active {
  background: var(--green-dark);
  color: var(--green);
}

/* Matrix canvas */
#matrix-canvas {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: none;
}

/* Sound toggle */
#sound-toggle {
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.2s;
}

#sound-toggle:hover { opacity: 1; }
#sound-toggle.active { opacity: 1; }

@media (max-width: 600px) {
  body { font-size: 11px; }
  #topbar { font-size: 10px; padding: 0 8px; }
  #output { padding: 8px; }
  #input-area { padding: 4px 8px 8px; }
}
</style>
<script src="https://bb.blackroad.io/bb.js" defer></script>

<body>

<div id="topbar">
  <span class="brand">BLACKROAD OS v3.0</span>
  <div class="indicators">
    <div class="indicator">
      <div class="status-dot"></div>
      <span>CONNECTED</span>
    </div>
    <div class="indicator" id="uptime-display">UP 00:00:00</div>
    <div class="indicator" id="node-count">8 NODES</div>
    <div class="indicator" id="sound-toggle" title="Toggle typing sounds">SND OFF</div>
  </div>
</div>

<div id="terminal-wrap">
  <div id="output"></div>
  <div id="input-area" style="display:none">
    <span id="prompt-label">blackroad@terminal $</span>
    <div id="input-wrapper">
      <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <span id="cursor"></span>
    </div>
  </div>
</div>

<div id="autocomplete"></div>
<canvas id="matrix-canvas"></canvas>

<script>
(function() {
  'use strict';

  // ─── State ─────────────────────────────────────────────────────────
  const output = document.getElementById('output');
  const inputArea = document.getElementById('input-area');
  const cmdInput = document.getElementById('cmd-input');
  const cursor = document.getElementById('cursor');
  const uptimeDisplay = document.getElementById('uptime-display');
  const autocompleteEl = document.getElementById('autocomplete');
  const soundToggle = document.getElementById('sound-toggle');
  const matrixCanvas = document.getElementById('matrix-canvas');

  let history = [];
  let historyIndex = -1;
  let startTime = Date.now();
  let soundEnabled = false;
  let matrixRunning = false;
  let acItems = [];
  let acIndex = -1;

  // ─── Audio Context (lazy) ──────────────────────────────────────────
  let audioCtx = null;
  function playClick() {
    if (!soundEnabled) return;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 800 + Math.random() * 400;
    gain.gain.value = 0.015;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? 'SND ON' : 'SND OFF';
    soundToggle.classList.toggle('active', soundEnabled);
    if (soundEnabled && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  });

  // ─── Cursor position tracking ─────────────────────────────────────
  function updateCursor() {
    const text = cmdInput.value.substring(0, cmdInput.selectionStart);
    const span = document.createElement('span');
    span.style.cssText = 'font-family:JetBrains Mono,monospace;font-size:14px;visibility:hidden;position:absolute;white-space:pre';
    span.textContent = text;
    document.body.appendChild(span);
    cursor.style.left = span.offsetWidth + 'px';
    document.body.removeChild(span);
  }

  // ─── Output helpers ────────────────────────────────────────────────
  function addLine(text, cls) {
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.innerHTML = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }

  function addRaw(html, cls) {
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.innerHTML = html;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }

  async function typeLines(lines, delay) {
    for (const l of lines) {
      addRaw(l.html, l.cls || '');
      if (l.delay !== undefined) await sleep(l.delay);
      else await sleep(delay || 120);
    }
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ─── Uptime counter ────────────────────────────────────────────────
  setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(s / 3600)).padStart(2, '0');
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    const sec = String(s % 60).padStart(2, '0');
    uptimeDisplay.textContent = 'UP ' + h + ':' + m + ':' + sec;
  }, 1000);

  // ─── Node / Agent / Model Data ─────────────────────────────────────
  const nodes = [
    { name: 'alice',     ip: '192.168.4.49',  type: 'Pi 400',   status: 'ONLINE',  role: 'Gateway / DNS / Pi-hole' },
    { name: 'cecilia',   ip: '192.168.4.96',  type: 'Pi 5',     status: 'ONLINE',  role: 'CECE API / TTS / Hailo-8' },
    { name: 'octavia',   ip: '192.168.4.100', type: 'Pi 5',     status: 'ONLINE',  role: 'Gitea / Docker Swarm / Hailo-8' },
    { name: 'aria',      ip: '192.168.4.98',  type: 'Pi 5',     status: 'OFFLINE', role: 'Portainer / Headscale' },
    { name: 'lucidia',   ip: '192.168.4.38',  type: 'Pi 5',     status: 'ONLINE',  role: 'CI/CD / Lucidia API' },
    { name: 'gematria',  ip: '10.8.0.8',      type: 'DO 4vCPU', status: 'DEGRADED', role: 'WireGuard hub / compute' },
    { name: 'anastasia', ip: '10.8.0.1',      type: 'DO 1vCPU', status: 'ONLINE',  role: 'Headscale / Nginx / API' },
    { name: 'mac',       ip: '192.168.4.28',  type: 'macOS',    status: 'ONLINE',  role: 'Operator workstation' },
  ];

  const agents = [
    { name: 'cece',       role: 'Conversational AI',     model: 'cece-3b-q4',    node: 'cecilia' },
    { name: 'lucidia',    role: 'Memory & knowledge',    model: 'llama3.1-8b',   node: 'lucidia' },
    { name: 'navigator',  role: 'Route optimization',    model: 'qwen2.5-7b',    node: 'cecilia' },
    { name: 'sentinel',   role: 'Security monitoring',   model: 'mistral-7b',    node: 'octavia' },
    { name: 'weaver',     role: 'Code generation',       model: 'codellama-13b', node: 'cecilia' },
    { name: 'oracle',     role: 'Prediction & analysis', model: 'gemma2-9b',     node: 'lucidia' },
    { name: 'herald',     role: 'Communications',        model: 'phi3-3.8b',     node: 'alice' },
    { name: 'archivist',  role: 'Data management',       model: 'llama3.2-3b',   node: 'octavia' },
    { name: 'phantom',    role: 'Stealth operations',    model: 'deepseek-r1-7b',node: 'anastasia' },
    { name: 'forge',      role: 'Infrastructure',        model: 'qwen2.5-coder', node: 'octavia' },
  ];

  const models = {
    'Ollama (Cecilia)': ['cece-3b-q4', 'cece-7b-q4', 'cece-13b-q4', 'cece-30b-q4', 'llama3.1-8b', 'codellama-13b', 'qwen2.5-7b', 'gemma2-2b', 'mistral-7b', 'phi3-3.8b', 'deepseek-r1-7b', 'qwen2.5-coder-7b'],
    'Ollama (Lucidia)': ['llama3.1-8b', 'gemma2-9b', 'llama3.2-3b', 'qwen2.5-7b'],
    'Ollama (Anastasia)': ['llama3.1-8b', 'mistral-7b'],
    'OpenAI': ['gpt-4o', 'gpt-4o-mini', 'dall-e-3'],
    'Anthropic': ['claude-sonnet-4-20250514', 'claude-3.5-haiku'],
    'Together AI': ['flux-schnell', 'llama-3.3-70b'],
    'Replicate': ['flux-1.1-pro', 'sdxl'],
    'Fal': ['flux-dev', 'flux-schnell'],
    'Google': ['gemini-2.0-flash'],
  };

  // ─── Commands ──────────────────────────────────────────────────────
  const commands = {};

  commands.help = function() {
    addLine('');
    addRaw('<span class="bold glow">Available Commands:</span>');
    addLine('');
    const cmds = [
      ['help',                  'Show this help message'],
      ['status',                'System status overview'],
      ['nodes',                 'List all network nodes'],
      ['agents',                'List all AI agents'],
      ['models',                'List all AI models by provider'],
      ['ping &lt;node&gt;',    'Ping a network node'],
      ['invoke &lt;agent&gt; &lt;task&gt;', 'Invoke an agent with a task'],
      ['mesh',                  'Display mesh network topology'],
      ['neofetch',              'System info with ASCII art'],
      ['matrix',                'Matrix rain animation (5s)'],
      ['whoami',                'Current user identity'],
      ['uname -a',              'System information'],
      ['uptime',                'System uptime'],
      ['clear',                 'Clear terminal'],
    ];
    for (const [cmd, desc] of cmds) {
      addRaw('  <span class="cyan">' + cmd.padEnd(30) + '</span><span class="dim">' + desc + '</span>');
    }
    addLine('');
  };

  commands.status = function() {
    const onlineNodes = nodes.filter(n => n.status === 'ONLINE').length;
    const s = Math.floor((Date.now() - startTime) / 1000);
    addLine('');
    addRaw('<span class="bold glow">╔══════════════════════════════════════════╗</span>');
    addRaw('<span class="bold glow">║       BLACKROAD OS — SYSTEM STATUS       ║</span>');
    addRaw('<span class="bold glow">╚══════════════════════════════════════════╝</span>');
    addLine('');
    addRaw('  <span class="dim">Nodes Online:</span>    <span class="bold">' + onlineNodes + '</span><span class="dim">/' + nodes.length + '</span>');
    addRaw('  <span class="dim">Agents Active:</span>   <span class="bold">' + agents.length + '</span>');
    addRaw('  <span class="dim">AI Providers:</span>    <span class="bold">' + Object.keys(models).length + '</span>');
    addRaw('  <span class="dim">Total Models:</span>    <span class="bold">' + Object.values(models).flat().length + '</span>');
    addRaw('  <span class="dim">Hailo-8 TOPS:</span>    <span class="bold">52</span> <span class="dim">(2x 26 TOPS)</span>');
    addRaw('  <span class="dim">WireGuard Mesh:</span>  <span class="green bold">ACTIVE</span> <span class="dim">(10.8.0.0/24)</span>');
    addRaw('  <span class="dim">Session Uptime:</span>  <span class="bold">' + formatUptime(s) + '</span>');
    addRaw('  <span class="dim">Mesh Bandwidth:</span>  <span class="bold">~1 Gbps</span> <span class="dim">(LAN) / 100 Mbps (WAN)</span>');
    addLine('');
  };

  commands.nodes = function() {
    addLine('');
    addRaw('<span class="bold glow">Network Nodes:</span>');
    addLine('');
    addRaw('  <span class="dim">NAME          IP               TYPE        STATUS      ROLE</span>');
    addRaw('  <span class="dim">────────────  ───────────────  ──────────  ──────────  ─────────────────────────────</span>');
    for (const n of nodes) {
      let statusColor = 'green';
      if (n.status === 'OFFLINE') statusColor = 'red';
      if (n.status === 'DEGRADED') statusColor = 'amber';
      addRaw('  ' + n.name.padEnd(14) +
        '<span class="dim">' + n.ip.padEnd(17) + '</span>' +
        n.type.padEnd(12) +
        '<span class="' + statusColor + ' bold">' + n.status.padEnd(12) + '</span>' +
        '<span class="dim">' + n.role + '</span>');
    }
    addLine('');
  };

  commands.agents = function() {
    addLine('');
    addRaw('<span class="bold glow">Agent Swarm:</span>');
    addLine('');
    addRaw('  <span class="dim">AGENT       ROLE                   MODEL              NODE</span>');
    addRaw('  <span class="dim">──────────  ─────────────────────  ─────────────────  ──────────</span>');
    for (const a of agents) {
      addRaw('  <span class="cyan">' + a.name.padEnd(12) + '</span>' +
        a.role.padEnd(23) +
        '<span class="dim">' + a.model.padEnd(19) + '</span>' +
        a.node);
    }
    addLine('');
  };

  commands.models = function() {
    addLine('');
    addRaw('<span class="bold glow">AI Models by Provider:</span>');
    let total = 0;
    for (const [provider, list] of Object.entries(models)) {
      addLine('');
      addRaw('  <span class="cyan bold">' + provider + '</span> <span class="dim">(' + list.length + ' models)</span>');
      for (const m of list) {
        addRaw('    <span class="dim">•</span> ' + m);
        total++;
      }
    }
    addLine('');
    addRaw('  <span class="dim">Total:</span> <span class="bold">' + total + ' models</span> <span class="dim">across</span> <span class="bold">' + Object.keys(models).length + ' providers</span>');
    addLine('');
  };

  commands.ping = function(args) {
    const target = (args[0] || '').toLowerCase();
    const node = nodes.find(n => n.name === target);
    if (!node) {
      addRaw('<span class="red">ping: unknown node "' + escapeHTML(target || '') + '". Available: ' + nodes.map(n => n.name).join(', ') + '</span>');
      return;
    }
    addLine('');
    addRaw('PING ' + node.name + ' (' + node.ip + '): 56 data bytes');
    const doPackets = async () => {
      if (node.status === 'OFFLINE') {
        await sleep(2000);
        addRaw('<span class="red">Request timeout for icmp_seq 0</span>');
        await sleep(1000);
        addRaw('<span class="red">Request timeout for icmp_seq 1</span>');
        addLine('');
        addRaw('<span class="red">--- ' + node.name + ' ping statistics ---</span>');
        addRaw('<span class="red">2 packets transmitted, 0 packets received, 100.0% packet loss</span>');
        addLine('');
        return;
      }
      for (let i = 0; i < 4; i++) {
        const ms = node.ip.startsWith('10.') ? (12 + Math.random() * 8).toFixed(1) : (0.5 + Math.random() * 2).toFixed(1);
        await sleep(300);
        addRaw('64 bytes from ' + node.ip + ': icmp_seq=' + i + ' ttl=64 time=<span class="green">' + ms + ' ms</span>');
      }
      addLine('');
      addRaw('--- ' + node.name + ' ping statistics ---');
      addRaw('4 packets transmitted, 4 received, <span class="green bold">0% packet loss</span>');
      addLine('');
    };
    doPackets();
  };

  commands.invoke = async function(args) {
    const agentName = (args[0] || '').toLowerCase();
    const task = args.slice(1).join(' ');
    const agent = agents.find(a => a.name === agentName);
    if (!agent) {
      addRaw('<span class="red">invoke: unknown agent "' + escapeHTML(agentName || '') + '". Available: ' + agents.map(a => a.name).join(', ') + '</span>');
      return;
    }
    if (!task) {
      addRaw('<span class="red">invoke: usage — invoke &lt;agent&gt; &lt;task description&gt;</span>');
      return;
    }
    addLine('');
    addRaw('<span class="dim">[' + agent.node + '] Loading ' + agent.model + '...</span>');
    await sleep(600);
    addRaw('<span class="dim">[' + agent.name + '] Processing: "' + escapeHTML(task) + '"</span>');
    await sleep(400);
    addLine('');

    const responses = {
      cece: 'I have analyzed the request. Based on my training data and current context, I can confirm that the BlackRoad mesh network is performing optimally. All distributed inference endpoints are responsive, and the agent swarm coordination protocol is functioning within expected parameters.',
      lucidia: 'Cross-referencing 156,675 memory entries in the FTS5 index. Pattern match confidence: 94.7%. The knowledge graph indicates strong correlation with previous operational data. Relevant context has been assembled from 12 memory clusters.',

  commands.matrix = function() {
    if (matrixRunning) return;
    matrixRunning = true;
    matrixCanvas.style.display = 'block';
    const ctx = matrixCanvas.getContext('2d');
    matrixCanvas.width = window.innerWidth;
    matrixCanvas.height = window.innerHeight;

    const fontSize = 14;
    const columns = Math.floor(matrixCanvas.width / fontSize);
    const drops = new Array(columns).fill(1);
    const chars = 'ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ01234567890BLACKROAD';

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      ctx.fillStyle = '#00FF41';
      ctx.font = fontSize + 'px JetBrains Mono';
      for (let i = 0; i < drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillStyle = Math.random() > 0.98 ? '#fff' : (Math.random() > 0.9 ? '#00D4FF' : '#00FF41');
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    const interval = setInterval(draw, 50);
    setTimeout(() => {
      clearInterval(interval);
      matrixCanvas.style.display = 'none';
      ctx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      matrixRunning = false;
      addRaw('<span class="dim">[matrix] Simulation ended.</span>');
    }, 5000);
  };

  commands.clear = function() {
    output.innerHTML = '';

  commands.whoami = function() {

  commands['uname -a'] = function() {
    addLine('BlackRoad OS 3.0 aarch64 ARM Cortex-A76 5-node mesh');
  };

  commands.uname = function(args) {

      commands['uname -a']();

    }

  commands.uptime = function() {
    const s = Math.floor((Date.now() - startTime) / 1000);
    const now = new Date().toLocaleTimeString('en-US', { hour12: false });
    addLine(' ' + now + ' up ' + formatUptime(s) + ', 1 user, load average: 0.42, 0.38, 0.31');
  };

  function formatUptime(s) {
    if (s < 60) return s + ' sec';
    if (s < 3600) return Math.floor(s / 60) + ' min ' + (s % 60) + ' sec';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ─── Command execution ────────────────────────────────────────────
  function execCommand(input) {
    const trimmed = input.trim();
    if (!trimmed) return;

    addRaw('<span class="cyan">blackroad@terminal $</span> <span class="glow">' + escapeHTML(trimmed) + '</span>');

    if (history[history.length - 1] !== trimmed) history.push(trimmed);
    historyIndex = history.length;

    const parts = trimmed.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1);

    // Special case: uname -a
    if (cmd === 'uname' && args[0] === '-a') {
      commands['uname -a']();
      return;
    }

    if (commands[cmd]) {
      commands[cmd](args);
    } else {
      addRaw('<span class="red">command not found: ' + escapeHTML(cmd) + '. Type \'help\' for available commands.</span>');
    }
  }

  // ─── Tab completion ────────────────────────────────────────────────
  const allCommands = ['help', 'status', 'nodes', 'agents', 'models', 'ping', 'invoke', 'mesh', 'neofetch', 'matrix', 'clear', 'whoami', 'uname', 'uptime'];
  const allNodeNames = nodes.map(n => n.name);
  const allAgentNames = agents.map(a => a.name);

  function getCompletions(text) {
    const parts = text.split(/\s+/);
    if (parts.length <= 1) {
      const prefix = parts[0].toLowerCase();
      return allCommands.filter(c => c.startsWith(prefix) && c !== prefix);
    }
    const cmd = parts[0].toLowerCase();
    const lastPart = parts[parts.length - 1].toLowerCase();
    if (cmd === 'ping') {
      return allNodeNames.filter(n => n.startsWith(lastPart) && n !== lastPart);
    }
    if (cmd === 'invoke' && parts.length === 2) {
      return allAgentNames.filter(a => a.startsWith(lastPart) && a !== lastPart);
    }
    return [];
  }

  function hideAutocomplete() {
    autocompleteEl.style.display = 'none';
    acItems = [];
    acIndex = -1;
  }

  // ─── Input handling ────────────────────────────────────────────────
  cmdInput.addEventListener('input', () => {
    updateCursor();
    playClick();
    hideAutocomplete();
  });

  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      hideAutocomplete();
      const val = cmdInput.value;
      cmdInput.value = '';
      updateCursor();
      execCommand(val);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (historyIndex > 0) {
        historyIndex--;
        cmdInput.value = history[historyIndex];
        updateCursor();
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIndex < history.length - 1) {
        historyIndex++;
        cmdInput.value = history[historyIndex];
      } else {
        historyIndex = history.length;
        cmdInput.value = '';
      }
      updateCursor();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const completions = getCompletions(cmdInput.value);
      if (completions.length === 1) {
        const parts = cmdInput.value.split(/\s+/);
        parts[parts.length - 1] = completions[0];
        cmdInput.value = parts.join(' ') + ' ';
        updateCursor();
        hideAutocomplete();
      } else if (completions.length > 1) {
        acItems = completions;
        acIndex = 0;
        showAutocomplete();
      }
    } else if (e.key === 'Escape') {
      hideAutocomplete();
    } else if (autocompleteEl.style.display !== 'none') {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (e.key === 'ArrowDown') acIndex = (acIndex + 1) % acItems.length;
        else acIndex = (acIndex - 1 + acItems.length) % acItems.length;
        renderAutocomplete();
      } else if (e.key === 'Enter' && acIndex >= 0) {
        e.preventDefault();
        const parts = cmdInput.value.split(/\s+/);
        parts[parts.length - 1] = acItems[acIndex];
        cmdInput.value = parts.join(' ') + ' ';
        updateCursor();
        hideAutocomplete();
      }
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault();
      commands.clear();
    }
  });

  function showAutocomplete() {
    const rect = cmdInput.getBoundingClientRect();
    autocompleteEl.style.left = rect.left + 'px';
    autocompleteEl.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
    autocompleteEl.style.display = 'block';
    renderAutocomplete();
  }

  function renderAutocomplete() {
    autocompleteEl.innerHTML = '';
    acItems.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'ac-item' + (i === acIndex ? ' active' : '');
      div.textContent = item;
      div.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const parts = cmdInput.value.split(/\s+/);
        parts[parts.length - 1] = item;
        cmdInput.value = parts.join(' ') + ' ';
        updateCursor();
        hideAutocomplete();
        cmdInput.focus();
      });
      autocompleteEl.appendChild(div);
    });
  }

  // Focus input on any click
  document.addEventListener('click', () => {
    if (!matrixRunning) cmdInput.focus();
  });

  // Handle window resize for matrix
  window.addEventListener('resize', () => {
    if (matrixRunning) {
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
    }
  });

      { html: '<span class="tag">[BOOT]</span> Agent swarm initialized: <span class="ok">10 agents ready</span>', cls: 'boot', delay: 300 },

      { html: '<span class="tag">[BOOT]</span> WireGuard mesh: <span class="ok">ACTIVE</span> (10.8.0.0/24)', cls: 'boot', delay: 300 },
      { html: '<span class="tag">[BOOT]</span> RoadNet WiFi backbone: <span class="ok">5 APs online</span>', cls: 'boot', delay: 250 },
      { html: '<span class="tag">[BOOT]</span> System ready. Type \'help\' for commands.', cls: 'boot', delay: 500 },

    await typeLines(bootLines);

    inputArea.style.display = 'flex';
