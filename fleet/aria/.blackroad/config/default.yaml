# BlackRoad Default Configuration
blackroad:
  version: "1.0.0"
  environment: "production"

services:
  api:
    port: 8000
    workers: 4
  mesh:
    port: 8765
  eventbus:
    port: 8766
  cache:
    port: 6379
  gateway:
    port: 8080

fleet:
  nodes:
    - cecilia
    - lucidia
    - octavia
    - aria
    - anastasia
  primary: cecilia

monitoring:
  health_interval: 60
  metrics_interval: 30
  log_retention_days: 30

security:
  session_timeout: 3600
  api_key_rotation: 86400
  zero_trust: true
