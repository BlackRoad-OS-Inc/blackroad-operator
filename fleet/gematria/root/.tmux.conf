# BlackRoad HOT PINK Theme
set -g status-style 'bg=#1a1a1a'
set -g status-left '#[fg=#F5A623,bold]◆#[fg=#FF1D6C]◆#[fg=#9C27B0]◆#[fg=#2979FF]◆ #[fg=#ffffff,bold]#{session_name} #[fg=#444444]│ '
set -g status-right '#[fg=#444444]│ #[fg=#FF1D6C]%H:%M #[fg=#F5A623]%d-%b#[default]'
set -g status-left-length 40
set -g window-status-format '#[fg=#666666] #I:#W '
set -g window-status-current-format '#[fg=#ffffff,bg=#FF1D6C,bold] #I:#W '
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#FF1D6C'
set -g message-style 'fg=#ffffff,bg=#FF1D6C'
