<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gematria - Lucidia Fleet</title>
    <style>
        :root {
            --amber: #FF8C00;
            --orange: #FF4500;
            --pink: #FF69B4;
            --magenta: #9932CC;
            --blue: #1E90FF;
            --black: #0a0a0a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: var(--black);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .gradient-bar {
            height: 4px;
            background: linear-gradient(90deg, var(--amber), var(--orange), var(--pink), var(--magenta), var(--blue));
            width: 100%;
            position: fixed;
            top: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .hostname {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(90deg, var(--amber), var(--pink), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .subtitle {
            color: #888;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(30, 144, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--blue);
            margin-bottom: 2rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .info {
            color: #666;
            font-size: 0.9rem;
            margin-top: 2rem;
        }
        .fleet {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }
        .fleet span {
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .c { background: var(--amber); color: black; }
        .l { background: var(--orange); color: black; }
        .a { background: var(--pink); color: black; }
        .o { background: var(--magenta); color: white; }
        .al { background: var(--blue); color: white; }
        .current { border: 2px solid white; }
        footer {
            position: fixed;
            bottom: 1rem;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="gradient-bar"></div>
    <div class="container">
        <div class="hostname">gematria</div>
        <div class="subtitle">Lucidia Fleet Node</div>
        <div class="status">
            <span class="dot"></span>
            <span>Online</span>
        </div>
        <div class="info">
            <p>BlackRoad OS, Inc. | AI-Native Operating System</p>
        </div>
        <div class="fleet">
            <span class="c ">cecilia</span>
            <span class="l ">lucidia</span>
            <span class="a ">aria</span>
            <span class="o ">octavia</span>
            <span class="al ">alice</span>
        </div>
    </div>
    <footer>Powered by Lucidia OS v5.0</footer>
</body>
</html>
