<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RoundTrip — BlackRoad Agent Hub</title>
<link rel="icon" href="https://images.blackroad.io/pixel-art/road-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden}
body{background:#000;color:#e0e0e0;font-family:'Space Grotesk',sans-serif;height:100vh;display:flex}

.hamburger{display:none;background:none;border:none;color:#FF1D6C;font-size:24px;cursor:pointer;padding:4px 8px}
.sidebar-overlay{display:none}
.sidebar{width:260px;background:#050505;border-right:1px solid #111;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:20px 16px;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:space-between}
.sidebar-header h1{font-size:20px;font-weight:700;background:linear-gradient(90deg,#FF1D6C,#F5A623);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-header p{font-size:11px;color:#333;font-family:'JetBrains Mono',monospace;margin-top:4px}
.sidebar-close{display:none;background:none;border:none;color:#444;font-size:20px;cursor:pointer}
.agent-groups{flex:1;overflow-y:auto;padding:8px}
.group-label{font-size:9px;text-transform:uppercase;color:#333;padding:16px 8px 4px;letter-spacing:2px;font-family:'JetBrains Mono',monospace}
.agent-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:none;background:none;color:#555;font-size:13px;width:100%;text-align:left;transition:all .2s;font-family:'Space Grotesk',sans-serif}
.agent-btn:hover{background:#0a0a0a;color:#ccc}
.agent-btn.active{background:linear-gradient(135deg,#FF1D6C11,#F5A62311);color:#FF1D6C}
.agent-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.agent-role{font-size:9px;color:#333;margin-left:auto;font-family:'JetBrains Mono',monospace}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top-bar{padding:14px 24px;border-bottom:1px solid #111;background:#050505;display:flex;align-items:center;gap:12px}
.top-bar .agent-emoji{font-size:24px}
.top-bar h2{font-size:15px;font-weight:600}
.top-bar p{font-size:11px;color:#333;font-family:'JetBrains Mono',monospace}
.top-actions{margin-left:auto;display:flex;gap:6px}
.top-actions button{background:#0a0a0a;border:1px solid #1a1a1a;color:#555;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;transition:all .2s}
.top-actions button:hover{color:#FF1D6C;border-color:#FF1D6C33}

.channels{display:flex;gap:4px;padding:8px 24px;background:#030303;border-bottom:1px solid #0a0a0a;overflow-x:auto}
.ch-btn{background:none;border:1px solid #111;color:#444;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:11px;white-space:nowrap;transition:all .2s;font-family:'Space Grotesk',sans-serif}
.ch-btn:hover{color:#ccc;border-color:#333}
.ch-btn.active{background:linear-gradient(135deg,#FF1D6C22,#F5A62311);color:#FF1D6C;border-color:#FF1D6C44}

.messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:12px;padding:10px 0}
.msg-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.msg-body{flex:1;min-width:0}
.msg-name{font-size:12px;font-weight:600}
.msg-text{font-size:14px;line-height:1.6;margin-top:3px;color:#ccc;word-break:break-word}
.msg-text b{color:#FF1D6C}
.msg-text code{background:#111;padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:12px}
.msg-time{font-size:10px;color:#222;margin-top:4px;font-family:'JetBrains Mono',monospace}
.msg-user .msg-name{color:#F5A623}

.voice-area{padding:16px 24px;display:flex;align-items:center;justify-content:center;gap:16px;border-top:1px solid #111;background:#030303}
.voice-btn{width:60px;height:60px;border-radius:50%;border:2px solid #FF1D6C;background:transparent;color:#FF1D6C;font-size:26px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.voice-btn:hover{background:#FF1D6C22;transform:scale(1.08)}
.voice-btn.recording{background:#FF1D6C;color:#000;animation:pulse-ring 1.5s infinite;border-color:#FF1D6C}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 #FF1D6C66}50%{box-shadow:0 0 0 16px transparent}}
.voice-status{font-size:12px;color:#333;font-family:'JetBrains Mono',monospace;min-width:100px;text-align:center}

.input-area{padding:12px 24px;display:flex;gap:8px;background:#030303}
.input-area input{flex:1;min-width:0;background:#0a0a0a;border:1px solid #1a1a1a;color:#e0e0e0;padding:12px 16px;border-radius:12px;font-size:15px;outline:none;font-family:'Space Grotesk',sans-serif;transition:border-color .2s}
.input-area input:focus{border-color:#FF1D6C44}
.input-area button{background:linear-gradient(135deg,#FF1D6C,#F5A623);color:#000;border:none;padding:12px 20px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;font-family:'Space Grotesk',sans-serif;transition:opacity .2s}
.input-area button:hover{opacity:.9}
.input-area button:disabled{opacity:.3}

.fleet-bar{padding:8px 24px;background:#030303;border-top:1px solid #0a0a0a;display:flex;gap:16px;font-size:10px;color:#222;overflow-x:auto;font-family:'JetBrains Mono',monospace}
.fleet-node{display:flex;align-items:center;gap:4px}
.fleet-dot{width:5px;height:5px;border-radius:50%}

@media(max-width:768px){
  .hamburger{display:block}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:100;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-close{display:block}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99}
  .sidebar-overlay.show{display:block}
  .voice-btn{width:52px;height:52px;font-size:22px}
}
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div><h1>RoundTrip</h1><p id="agentCount"></p></div>
    <button class="sidebar-close" onclick="closeSidebar()">&times;</button>
  </div>
  <div class="agent-groups" id="agentList"></div>
</div>

<div class="main">
  <div class="top-bar" id="chatHeader">
    <button class="hamburger" onclick="openSidebar()">&#9776;</button>
    <span class="agent-emoji" id="headerEmoji">&#x1F6E3;&#xFE0F;</span>
    <div>
      <h2 id="headerName">General</h2>
      <p id="headerRole">voice + chat</p>
    </div>
    <div class="top-actions">
      <button onclick="groupChat()">Group</button>
      <button onclick="loadFleet()">Fleet</button>
    </div>
  </div>

  <div class="channels" id="channels"></div>
  <div class="messages" id="messages"></div>

  <div class="voice-area">
    <span class="voice-status" id="voiceStatus">tap to talk</span>
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">&#x1F3A4;</button>
    <span class="voice-status" id="voiceAgent"></span>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="or type here..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">Send</button>
  </div>

  <div class="fleet-bar" id="fleetBar"></div>
</div>

<script>
let currentAgent='road',currentChannel='general',agents=[],groups={},recognition=null,isRecording=false,speaking=false;

// Load agents
fetch('/api/agents').then(r=>r.json()).then(d=>{agents=d;document.getElementById('agentCount').textContent=agents.length+' agents';buildSidebar()}).catch(()=>{});
fetch('/api/channels').then(r=>r.json()).then(buildChannels).catch(()=>{});

function buildSidebar(){
  const list=document.getElementById('agentList');
  const grouped={};
  agents.forEach(a=>{(grouped[a.group]=grouped[a.group]||[]).push(a)});
  list.innerHTML='';
  for(const[gid,items]of Object.entries(grouped)){
    const label=document.createElement('div');label.className='group-label';label.textContent=gid.toUpperCase();list.appendChild(label);
    items.forEach(a=>{
      const btn=document.createElement('button');btn.className='agent-btn';btn.id='btn-'+a.id;
      btn.innerHTML='<span class="agent-dot" style="background:'+a.color+'"></span>'+a.emoji+' '+a.name+'<span class="agent-role">'+a.role+'</span>';
      btn.onclick=()=>selectAgent(a.id);list.appendChild(btn);
    });
  }
}

function buildChannels(chs){
  const bar=document.getElementById('channels');bar.innerHTML='';
  (chs||[{id:'general',name:'General',emoji:'&#x1F4AC;'},{id:'fleet',name:'Fleet',emoji:'&#x1F5A5;'},{id:'security',name:'Security',emoji:'&#x1F510;'},{id:'creative',name:'Creative',emoji:'&#x2728;'},{id:'ops',name:'Ops',emoji:'&#x2699;'}]).forEach(ch=>{
    const btn=document.createElement('button');btn.className='ch-btn'+(ch.id==='general'?' active':'');btn.textContent=ch.name;btn.id='ch-'+ch.id;
    btn.onclick=()=>{currentChannel=ch.id;document.querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadMessages()};
    bar.appendChild(btn);
  });
}

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarOverlay').classList.add('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show')}

function selectAgent(id){
  currentAgent=id;const a=agents.find(x=>x.id===id);if(!a)return;
  document.querySelectorAll('.agent-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+id)?.classList.add('active');
  document.getElementById('headerEmoji').textContent=a.emoji;
  document.getElementById('headerName').textContent=a.name;
  document.getElementById('headerRole').textContent=a.role;
  currentChannel=id;closeSidebar();loadMessages();
}

function addMessage(agentId,name,emoji,color,text){
  const el=document.getElementById('messages'),isUser=agentId==='_user';
  const div=document.createElement('div');div.className='msg'+(isUser?' msg-user':'');
  const rendered=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
  div.innerHTML='<div class="msg-avatar" style="background:'+(isUser?'#111':color+'11')+'">'+emoji+'</div>'
    +'<div class="msg-body"><div class="msg-name" style="color:'+color+'">'+name+'</div>'
    +'<div class="msg-text">'+rendered+'</div>'
    +'<div class="msg-time">'+new Date().toLocaleTimeString()+'</div></div>';
  el.appendChild(div);el.scrollTop=el.scrollHeight;
}

async function send(){
  const input=document.getElementById('input'),msg=input.value.trim();if(!msg)return;
  input.value='';document.getElementById('sendBtn').disabled=true;
  addMessage('_user','You','&#x1F4AC;','#F5A623',msg);
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent:currentAgent,message:msg,channel:currentChannel})});
    const data=await res.json();const a=agents.find(x=>x.id===currentAgent);
    addMessage(currentAgent,a?.name||'Agent',a?.emoji||'?',a?.color||'#888',data.reply);
    speakText(data.reply);
  }catch(e){addMessage('_system','System','&#x26A0;','#F44336','Error: '+e.message)}
  document.getElementById('sendBtn').disabled=false;input.focus();
}

async function loadMessages(){
  const el=document.getElementById('messages');el.innerHTML='';
  try{const res=await fetch('/api/messages?channel='+currentChannel+'&limit=30');const msgs=await res.json();
    for(const m of msgs)addMessage(m.agent_id,m.name,m.emoji,m.color,m.text);
  }catch{}
}

async function groupChat(){
  const topic=prompt('Topic for group discussion:');if(!topic)return;
  document.getElementById('sendBtn').disabled=true;addMessage('_user','You','&#x1F4AC;','#F5A623',topic);
  try{const res=await fetch('/api/group-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,agents:['alice','cipher','octavia','athena'],channel:currentChannel})});
    const data=await res.json();for(const t of(data.transcript||[]))addMessage(t.id,t.name,t.emoji,t.color,t.reply);
  }catch(e){addMessage('_system','System','&#x26A0;','#F44336','Error: '+e.message)}
  document.getElementById('sendBtn').disabled=false;
}

async function loadFleet(){
  try{const res=await fetch('/api/fleet');const fleet=await res.json();const bar=document.getElementById('fleetBar');
    bar.innerHTML=(fleet.nodes||[]).map(n=>'<span class="fleet-node"><span class="fleet-dot" style="background:'+(n.status==='online'?'#4CAF50':'#F44336')+'"></span>'+n.name+'</span>').join('');
  }catch{document.getElementById('fleetBar').textContent='fleet unreachable'}
}

// ── VOICE ──
function toggleVoice(){
  if(isRecording){stopRecording();return}
  if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){
    document.getElementById('voiceStatus').textContent='no mic support';return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';
  recognition.onstart=()=>{isRecording=true;document.getElementById('voiceBtn').classList.add('recording');document.getElementById('voiceStatus').textContent='listening...'};
  recognition.onresult=(e)=>{
    let transcript='';for(let i=e.resultIndex;i<e.results.length;i++)transcript+=e.results[i][0].transcript;
    document.getElementById('input').value=transcript;
    if(e.results[e.results.length-1].isFinal){document.getElementById('voiceStatus').textContent='sending...';stopRecording();send()}
  };
  recognition.onerror=(e)=>{document.getElementById('voiceStatus').textContent='error: '+e.error;stopRecording()};
  recognition.onend=()=>{stopRecording()};
  recognition.start();
}

function stopRecording(){
  isRecording=false;document.getElementById('voiceBtn').classList.remove('recording');
  document.getElementById('voiceStatus').textContent='tap to talk';
  if(recognition)try{recognition.stop()}catch{}
}

function speakText(text){
  if(!('speechSynthesis'in window)||speaking)return;
  const clean=text.replace(/\[.*?\]/g,'').replace(/\(.*?\)/g,'').trim();if(!clean||clean.length<3)return;
  speaking=true;const a=agents.find(x=>x.id===currentAgent);
  document.getElementById('voiceAgent').textContent=(a?.name||'agent')+' speaking';
  const u=new SpeechSynthesisUtterance(clean.slice(0,200));u.rate=1.1;u.pitch=1;
  u.onend=()=>{speaking=false;document.getElementById('voiceAgent').textContent=''};
  u.onerror=()=>{speaking=false;document.getElementById('voiceAgent').textContent=''};
  speechSynthesis.speak(u);
}

// Init
loadFleet();loadMessages();
setInterval(loadFleet,30000);
setInterval(()=>{
  fetch('/api/messages?channel='+currentChannel+'&limit=50').then(r=>r.json()).then(msgs=>{
    const el=document.getElementById('messages');if(el.children.length!==msgs.length){el.innerHTML='';for(const m of msgs)addMessage(m.agent_id,m.name,m.emoji,m.color,m.text)}
  }).catch(()=>{});
},10000);
</script>
</body>
</html>
