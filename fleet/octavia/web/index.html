<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackRoad OS - Brady Bunch Grid</title>
  <style>
    :root {
      --black: #000000;
      --white: #FFFFFF;
      --hot-pink: #FF1D6C;
      --amber: #F5A623;
      --electric-blue: #2979FF;
      --violet: #9C27B0;
      --green: #2ecc71;
      --red: #e74c3c;
      --dark-gray: #1e1e1e;
      --mid-gray: #3c3c3c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      overflow: hidden;
    }

    .header {
      background: var(--dark-gray);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--hot-pink);
    }

    .header h1 {
      font-size: 24px;
      background: linear-gradient(135deg, var(--amber), var(--hot-pink), var(--violet), var(--electric-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .status {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .header .time {
      color: var(--amber);
      font-size: 18px;
    }

    .header .online-count {
      color: var(--green);
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
      height: calc(100vh - 70px);
    }

    .device-card {
      background: var(--mid-gray);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .device-card.online {
      border: 3px solid var(--green);
    }

    .device-card.offline {
      border: 3px solid var(--red);
      opacity: 0.7;
    }

    .device-card.primary {
      border-color: var(--hot-pink);
    }

    .device-name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .device-card.primary .device-name {
      color: var(--hot-pink);
    }

    .device-name:not(.primary) {
      color: var(--electric-blue);
    }

    .device-ip {
      font-size: 14px;
      color: #888;
      margin-bottom: 5px;
    }

    .device-hw {
      font-size: 12px;
      color: var(--amber);
      margin-bottom: 15px;
    }

    .stats {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-label {
      width: 40px;
      font-size: 12px;
      color: #aaa;
    }

    .stat-bar {
      flex: 1;
      height: 16px;
      background: var(--dark-gray);
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .stat-bar-fill.cpu { background: var(--hot-pink); }
    .stat-bar-fill.mem { background: var(--violet); }
    .stat-bar-fill.disk { background: var(--electric-blue); }

    .stat-value {
      width: 45px;
      text-align: right;
      font-size: 12px;
    }

    .device-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 12px;
    }

    .temp {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .temp.cool { color: var(--green); }
    .temp.warm { color: var(--amber); }
    .temp.hot { color: var(--red); }

    .uptime {
      color: #888;
    }

    .offline-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: var(--red);
      font-weight: bold;
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(6, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>BlackRoad OS - Brady Bunch</h1>
    <div class="status">
      <span class="online-count" id="onlineCount">0/6 online</span>
      <span class="time" id="clock">00:00:00</span>
    </div>
  </div>

  <div class="grid" id="deviceGrid"></div>

  <script>
    const DEVICES = [
      { name: 'cecilia', ip: '192.168.4.89', hw: 'Pi 5 + Hailo-8 (26 TOPS)', role: 'Primary AI', primary: true },
      { name: 'lucidia', ip: '192.168.4.81', hw: 'Pi 5 + Pironman + 1TB NVMe', role: 'AI Brain' },
      { name: 'octavia', ip: '192.168.4.38', hw: 'Pi 5', role: 'Processing' },
      { name: 'alice', ip: '192.168.4.49', hw: 'Pi 400 (4GB)', role: 'Worker' },
      { name: 'aria', ip: '192.168.4.82', hw: 'Pi 5', role: 'Harmony' },
      { name: 'shellfish', ip: '174.138.44.45', hw: 'DigitalOcean', role: 'Edge' }
    ];

    // Simulated device state (in production, fetch from API)
    const deviceState = {};
    DEVICES.forEach(d => {
      deviceState[d.name] = {
        online: Math.random() > 0.2,
        cpu: Math.random() * 60 + 10,
        mem: Math.random() * 50 + 20,
        disk: Math.random() * 40 + 30,
        temp: Math.random() * 30 + 40,
        uptime: `up ${Math.floor(Math.random() * 30)} days`
      };
    });

    function createDeviceCard(device) {
      const state = deviceState[device.name];
      const tempClass = state.temp < 55 ? 'cool' : (state.temp < 65 ? 'warm' : 'hot');

      return `
        <div class="device-card ${state.online ? 'online' : 'offline'} ${device.primary ? 'primary' : ''}">
          <div class="device-name">${device.name.toUpperCase()}</div>
          <div class="device-ip">${device.ip}</div>
          <div class="device-hw">${device.hw}</div>

          ${state.online ? `
            <div class="stats">
              <div class="stat-row">
                <span class="stat-label">CPU</span>
                <div class="stat-bar">
                  <div class="stat-bar-fill cpu" style="width: ${state.cpu}%"></div>
                </div>
                <span class="stat-value">${state.cpu.toFixed(0)}%</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">MEM</span>
                <div class="stat-bar">
                  <div class="stat-bar-fill mem" style="width: ${state.mem}%"></div>
                </div>
                <span class="stat-value">${state.mem.toFixed(0)}%</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">DISK</span>
                <div class="stat-bar">
                  <div class="stat-bar-fill disk" style="width: ${state.disk}%"></div>
                </div>
                <span class="stat-value">${state.disk.toFixed(0)}%</span>
              </div>
            </div>

            <div class="device-footer">
              <span class="temp ${tempClass}">${state.temp.toFixed(1)}C</span>
              <span class="uptime">${state.uptime}</span>
            </div>
          ` : `
            <div class="offline-msg pulse">OFFLINE</div>
          `}
        </div>
      `;
    }

    function render() {
      const grid = document.getElementById('deviceGrid');
      grid.innerHTML = DEVICES.map(createDeviceCard).join('');

      const onlineCount = DEVICES.filter(d => deviceState[d.name].online).length;
      document.getElementById('onlineCount').textContent = `${onlineCount}/${DEVICES.length} online`;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
    }

    // Simulate live updates
    function updateStats() {
      DEVICES.forEach(d => {
        const state = deviceState[d.name];
        if (state.online) {
          state.cpu = Math.max(5, Math.min(95, state.cpu + (Math.random() - 0.5) * 10));
          state.mem = Math.max(10, Math.min(90, state.mem + (Math.random() - 0.5) * 5));
          state.temp = Math.max(35, Math.min(80, state.temp + (Math.random() - 0.5) * 2));
        }
        // Random connectivity changes
        if (Math.random() > 0.98) {
          state.online = !state.online;
        }
      });
      render();
    }

    // Initial render
    render();
    updateClock();

    // Update every second
    setInterval(updateClock, 1000);
    setInterval(updateStats, 3000);
  </script>
</body>
</html>
