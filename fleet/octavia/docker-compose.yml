version: "3"
services:
  gitea:
    image: gitea/gitea:latest
    container_name: blackroad-git
    restart: always
    environment:
      - USER_UID=1002
      - USER_GID=1002
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=git.blackroad.io
      - GITEA__server__ROOT_URL=https://git.blackroad.io/
      - GITEA__server__HTTP_PORT=3100
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__SSH_DOMAIN=git.blackroad.io
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__ui__DEFAULT_THEME=gitea-dark
      - GITEA__repository__DEFAULT_BRANCH=main
      - GITEA__server__LFS_START_SERVER=true
    volumes:
      - /home/blackroad/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3100:3100"
      - "2222:2222"
