name: Agent Task
description: Create an agent-executable task with enough context for autonomous execution
title: '[Agent]: '
labels: ['type:agent', 'status:backlog']
body:
  - type: markdown
    attributes:
      value: |
        Post a task to the agent task marketplace. Agents can claim, execute, and report back.

  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: 'Unique ID for tracking (format: WF-YYYYMMDD-XXX-0001)'
      placeholder: 'WF-20260219-AGT-0001'

  - type: dropdown
    id: agent
    attributes:
      label: Assigned agent (or any)
      description: Which agent should handle this?
      options:
        - Any available
        - Lucidia (Coordinator)
        - Alice (Router)
        - Octavia (Compute)
        - Prism (Analyst)
        - Echo (Memory)
        - Cipher (Security)
        - CeCe (Soul)
    validations:
      required: true

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      description: How autonomous should the assigned agent be?
      options:
        - Autonomous - agent may act without waiting for approval on normal repo-safe steps
        - Guided - agent should propose plan before changing anything substantial
        - Human checkpoint required - agent must stop before execution
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Task priority level.
      options:
        - P2 - Normal
        - P1 - High
        - P0 - Critical
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task description
      description: What needs to be done? Be specific enough for an agent to execute autonomously.
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: Desired outcome
      description: What should exist, be fixed, or be deployed when this is complete?
      placeholder: |
        Example:
        - Pages site updated at blackroad.io
        - workflow passes on main
        - README reflects new public 4-org structure
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: input
    id: skills
    attributes:
      label: Required skills
      description: Comma-separated skills needed.
      placeholder: 'python, api, security'

  - type: textarea
    id: tool_access
    attributes:
      label: Tools and systems the agent may use
      description: List the concrete tools, services, or commands the agent can touch.
      placeholder: |
        Example:
        - br ai
        - br pi
        - br deploy
        - br cloudflare
        - GitHub Actions
        - local Ollama

  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: 'Other task IDs this depends on (comma-separated). Use repo#ID for cross-repo.'
      placeholder: 'WF-20260219-INF-0001, BlackRoad-OS/other-repo#WF-...'

  - type: dropdown
    id: scope
    attributes:
      label: Blast radius
      options:
        - Local (this repo only)
        - Service (one deployed service)
        - System (multiple services)
        - Public (user-facing)
        - Experimental (safe to break)
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback / safety notes
      description: How should the agent recover if the change misbehaves?
      placeholder: |
        Example:
        - revert generated site changes
        - disable workflow by file rename
        - roll back Cloudflare Pages to last successful deploy
