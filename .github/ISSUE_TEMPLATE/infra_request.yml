name: Operations Request
description: Request deploy, DNS, workflow, Pi fleet, monitoring, or local AI operations work
title: '[Infra]: '
labels: ['type:infra', 'status:backlog']
body:
  - type: markdown
    attributes:
      value: |
        Request changes to BlackRoad operations: deployments, DNS, workers, Pi fleet, workflows, or Ollama routing.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which infrastructure is affected?
      multiple: true
      options:
        - Cloudflare (Workers/Pages/DNS/KV/R2)
        - Railway
        - Vercel
        - DigitalOcean
        - Raspberry Pi fleet
        - GitHub Actions
        - Tailscale mesh
        - Cloudflare Tunnel
        - Local Ollama operator
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: Action type
      options:
        - Deploy new service
        - Update existing service
        - DNS / domain change
        - Scale up / down
        - Security patch
        - Monitoring / alerting
        - Decommission
        - Workflow / automation change
        - Ollama / agent routing change
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P2 - Normal
        - P1 - High
        - P0 - Critical (outage)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What needs to happen?
      description: Describe the infrastructure change in detail.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact assessment
      description: What services/users are affected? Any downtime expected?

  - type: textarea
    id: rollback
    attributes:
      label: Rollback plan
      description: How do we revert if something goes wrong?

  - type: textarea
    id: executable_path
    attributes:
      label: Executable path
      description: If this should be runnable by agents, describe the exact command or automation target.
      placeholder: |
        Example:
        - br ai autonomous "deploy blackroad.io and verify health"
        - br cloudflare dns list blackroad.io
        - br pi status
