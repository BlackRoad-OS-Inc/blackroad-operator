name = "chat-blackroad"
main = "src/worker.js"
compatibility_date = "2024-12-01"
workers_dev = true

routes = [
  { pattern = "chat.blackroad.io/*", zone_name = "blackroad.io" }
]

[vars]
OLLAMA_URL = "https://ollama.gematria.blackroad.io"
MESH_SECRET = "blackroad-mesh-2026"

# Task storage, memory, and background job state
[[kv_namespaces]]
binding = "TASKS"
id = "be621a228a014a0d9499f909a33a60bf"

[[kv_namespaces]]
binding = "MEMORY"
id = "ffc27d471eba446cb49fc84f41531630"

[[d1_databases]]
binding = "CHAT_DB"
database_name = "blackroad-chat"
database_id = "ec4efdfb-a76e-46fb-a821-1278e17e7b90"
