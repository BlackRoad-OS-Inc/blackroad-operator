## Architecture

Three components, all sovereign:

| Component | Stack | Location |
|-----------|-------|----------|
| Capture Worker | Cloudflare Worker + D1 | analytics-blackroad.workers.dev |

114 lines. No build step. No npm packages. Just \`navigator.sendBeacon\`:

<pre><code>function beacon(endpoint, data) {

  if (navigator.sendBeacon) {

  } else {
    fetch(ANALYTICS_URL + endpoint, {

    }).catch(() => {});
  }
}</code></pre>

Session IDs are \`crypto.randomUUID()\` — generated fresh per tab, never persisted. When you close the tab, the session ID is gone forever. No cookies, no localStorage, no fingerprinting.

## Why we killed Clerk

Third-party auth is a trap. You're one pricing change away from rewriting your entire auth layer. We tried Clerk — it worked — but "working" isn't the same as "sovereign."

So we built our own. In one session. On Cloudflare Workers + D1.

## How it works

The stack is stupidly simple:

- **PBKDF2** (100,000 iterations, SHA-256) for password hashing via Web Crypto API
- **JWT** (HS256) for session tokens, also via Web Crypto
- **D1** (SQLite on Cloudflare's edge) for user + session storage
- **Zero npm dependencies** — everything is Web Crypto native

<pre><code>// Hash a password — Web Crypto only
async function hashPassword(password, salt) {
  salt = salt || crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, key, 256
  );
  return \`\${btoa(String.fromCharCode(...salt))}:\${btoa(String.fromCharCode(...new Uint8Array(bits)))}\`;
}</code></pre>

This means every number is natively signed. No separate sign bit. No two's complement. Negation is free — just flip every trit.

## Standard ternary vs balanced

<pre><code>Standard: 42 → "1120" (base 3, digits 0-2)
Balanced: 42 → "1TTT0" (base 3, trits -1/0/+1)</code></pre>

Balanced ternary is unique among positional number systems: every integer has exactly one representation, and negation requires zero computation.

## Web Crypto API: the secret weapon

Most auth libraries exist because crypto used to be hard in JavaScript. Web Crypto changed that:

### Password hashing (PBKDF2)
<pre><code>async function hashPassword(password, salt) {
  salt = salt || crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password),
    'PBKDF2', false, ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: 100000,
      hash: 'SHA-256' }, key, 256
  );
  return \`\${btoa(salt)}:\${btoa(bits)}\`;
}</code></pre>

### JWT creation (HMAC-SHA256)
<pre><code>async function createJWT(payload, secret) {
  const header = { alg: 'HS256', typ: 'JWT' };
  const body = { ...payload, iat: now, exp: now + 86400,
                 iss: 'blackroad.io' };
  const data = \`\${b64(header)}.\${b64(body)}\`;
  const key = await crypto.subtle.importKey(
    'raw', enc(secret),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']

  const sig = await crypto.subtle.sign('HMAC', key, enc(data));
  return \`\${data}.\${b64url(sig)}\`;

## Why shell scripts?

Shell scripts run everywhere BlackRoad runs — Mac, Pi, DO droplets. No runtime to install. No dependencies. SSH into any node, run the script.

The entire fleet management layer is bash + SSH + cron. No Ansible. No Terraform. No Kubernetes. Just scripts that do one thing and do it well.

function md(src) {
  // Tiny markdown → HTML (handles ##, **, -, >, |tables|, `code`)
  let html = '', inUl = false, inTable = false;
  const lines = src.split('\n');
  for (let i = 0; i < lines.length; i++) {
    let l = lines[i];
    // Skip raw HTML lines
    if (/^</.test(l.trim())) {
      if (inUl) { html += '</ul>'; inUl = false; }
      if (inTable) { html += '</table>'; inTable = false; }
      html += l + '\n'; continue;
    }
    // Table rows
    if (/^\|/.test(l.trim())) {
      if (!inTable) { html += '<table style="width:100%;border-collapse:collapse;margin:16px 0;font-size:14px">'; inTable = true; }
      if (/^\|[\s-|]+\|$/.test(l.trim())) continue; // skip separator
      const cells = l.trim().split('|').filter(c => c !== '');
      const tag = !html.includes('<tr>') || html.lastIndexOf('</table>') > html.lastIndexOf('<table') ? 'th' : 'td';
      const isFirst = html.indexOf('<tr>') === -1 || html.lastIndexOf('</table>') > html.lastIndexOf('<tr>');
      html += '<tr>' + cells.map(c => \`<td style="padding:8px 12px;border-bottom:1px solid #1a1a1a;color:#737373">\${inline(c.trim())}</td>\`).join('') + '</tr>';
      continue;
    } else if (inTable) { html += '</table>'; inTable = false; }
    // Headings
    if (/^### /.test(l.trim())) { if(inUl){html+='</ul>';inUl=false;} html += \`<h3>\${inline(l.trim().slice(4))}</h3>\`; continue; }
    if (/^## /.test(l.trim())) { if(inUl){html+='</ul>';inUl=false;} html += \`<h2>\${inline(l.trim().slice(3))}</h2>\`; continue; }
    // List items
    if (/^- /.test(l.trim())) {
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += \`<li>\${inline(l.trim().slice(2))}</li>\`; continue;
    } else if (inUl) { html += '</ul>'; inUl = false; }
    // Blockquote
    if (/^> /.test(l.trim())) { html += \`<blockquote>\${inline(l.trim().slice(2))}</blockquote>\`; continue; }
    // Blank line
    if (l.trim() === '') { continue; }
    // Paragraph
    html += \`<p>\${inline(l)}</p>\`;
  }
  if (inUl) html += '</ul>';
  if (inTable) html += '</table>';
  return html;
}
function inline(s) {
  return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
}

function renderPost(slug) {
  const post = POSTS.find(p => p.slug === slug);
  if (!post) return \`<p>Not found.</p><a href="#/" class="back">&larr; Back</a>\`;
  return \`
    <article>
      <a href="#/" class="back">&larr; All articles</a>
      <div class="post-date">\${post.date}</div>
      <h1>\${post.title}</h1>
      <div class="meta">\${post.tags.map(t => \`#\${t}\`).join(' &middot; ')} &middot; BlackRoad OS Engineering</div>
      \${md(post.body)}
      <div style="margin-top:48px;padding-top:24px;border-top:1px solid #141414">
        <a href="#/" class="back">&larr; All articles</a>
      </div>
    </article>
  \`;
}

// Live stats from stats API
async function loadStats() {
  try {
    const res = await fetch('https://stats-blackroad.amundsonalexa.workers.dev/all');
    const data = await res.json();
    if (data.github) document.getElementById('s-repos').textContent = data.github.non_fork_repos || '—';
    if (data.fleet?.data) document.getElementById('s-models').textContent = data.fleet.data.total_ollama_models || '—';
    // Auth stats
    try {
      const auth = await fetch('https://auth.blackroad.io/api/stats').then(r => r.json());
      document.getElementById('s-users').textContent = auth.users || '—';
    } catch { document.getElementById('s-users').textContent = '—'; }
  } catch {}
}

function route() {
  const hash = location.hash.slice(1) || '/';
  const app = document.getElementById('app');
  if (hash === '/') {
    app.innerHTML = renderIndex();
    loadStats();
  } else {
    const slug = hash.slice(1);
    app.innerHTML = renderPost(slug);
    window.scrollTo(0, 0);
  }
}

window.addEventListener('hashchange', route);
route();
