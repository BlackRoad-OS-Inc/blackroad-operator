<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadWorld Minnesota — Minneapolis to Lakeville</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://images.blackroad.io/brand/br-square-32.png">
<meta name="description" content="RoadWorld Minnesota — Isometric pixel art from Minneapolis to Lakeville. BlackRoad OS.">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1628;overflow:hidden;font-family:'JetBrains Mono',monospace;color:#fff}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}

#hud{position:fixed;top:0;left:0;right:0;z-index:10;padding:10px 20px;
  background:linear-gradient(180deg,rgba(10,22,40,0.95),transparent);
  display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-title{font-family:'Space Grotesk';font-size:13px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(135deg,#FF6B2B,#FF2255,#4488FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hud-sub{font-size:8px;letter-spacing:2px;opacity:0.4;margin-top:2px}
.hud-stats{display:flex;gap:16px;font-size:10px;opacity:0.6}

#location-panel{position:fixed;top:60px;right:16px;z-index:10;width:220px;padding:14px;
  background:rgba(10,22,40,0.92);border:1px solid rgba(41,121,255,0.2);border-radius:10px;
  backdrop-filter:blur(10px);display:none}
.lp-city{font-family:'Space Grotesk';font-size:12px;font-weight:700;margin-bottom:3px}
.lp-landmark{font-size:10px;opacity:0.5;margin-bottom:8px}
.lp-stat{display:flex;justify-content:space-between;font-size:9px;padding:3px 0;
  border-bottom:1px solid rgba(255,255,255,0.04)}
.lp-val{color:#00D4FF}

#minimap{position:fixed;bottom:16px;right:16px;z-index:10;width:60px;height:200px;
  background:rgba(10,22,40,0.85);border:1px solid rgba(41,121,255,0.2);border-radius:6px;overflow:hidden}
#minimap canvas{width:100%;height:100%}

#bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:8px 20px;
  background:linear-gradient(0deg,rgba(10,22,40,0.95),transparent);
  font-size:9px;opacity:0.35;text-align:center;pointer-events:none;letter-spacing:1px}

#tooltip{position:fixed;z-index:30;padding:6px 12px;background:rgba(10,22,40,0.95);
  border:1px solid rgba(255,29,108,0.4);border-radius:6px;font-size:10px;
  pointer-events:none;display:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div><div class="hud-title">ROADWORLD MINNESOTA</div><div class="hud-sub">MINNEAPOLIS → LAKEVILLE</div></div>
  <div class="hud-stats">
    <span id="hud-city">DOWNTOWN</span>
    <span>|</span>
    <span id="hud-pos">0, 0</span>
    <span>|</span>
    <span>BlackRoad OS</span>
  </div>
</div>

<div id="location-panel">
  <div class="lp-city" id="lp-city"></div>
  <div class="lp-landmark" id="lp-landmark"></div>
  <div class="lp-stat"><span>Type</span><span class="lp-val" id="lp-type"></span></div>
  <div class="lp-stat"><span>Nodes</span><span class="lp-val" id="lp-nodes"></span></div>
  <div class="lp-stat"><span>Status</span><span class="lp-val">Online</span></div>
</div>

<div id="minimap"><canvas id="mm" width="60" height="200"></canvas></div>
<div id="tooltip"></div>
<div id="bottom">WASD / ARROWS TO MOVE · SCROLL TO ZOOM · HOVER LANDMARKS · MINNEAPOLIS TO LAKEVILLE</div>

<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const mm = document.getElementById('mm').getContext('2d');
let W, H, dpr = window.devicePixelRatio || 1;

// ── BRAND ──
const P = {pink:'#FF2255',amber:'#FF6B2B',blue:'#4488FF',violet:'#8844FF',green:'#00D4FF'};

// ── ISOMETRIC HELPERS ──
const ISO_W = 32, ISO_H = 16; // tile dimensions
function toScreen(gx, gy) {
  return { x: (gx - gy) * ISO_W / 2, y: (gx + gy) * ISO_H / 2 };
}
function toGrid(sx, sy) {
  const gx = (sx / (ISO_W/2) + sy / (ISO_H/2)) / 2;
  const gy = (sy / (ISO_H/2) - sx / (ISO_W/2)) / 2;
  return { x: Math.floor(gx), y: Math.floor(gy) };
}

// ── MAP (100 tiles tall = Minneapolis to Lakeville, 40 wide) ──
const MAP_W = 40, MAP_H = 100;

// Terrain: 0=grass, 1=road, 2=water, 3=building, 4=park, 5=highway, 6=suburb
const terrain = new Uint8Array(MAP_W * MAP_H);

// Cities along the corridor (grid Y ranges)
const CITIES = [
  { name:'DOWNTOWN MPLS', yStart:0, yEnd:12, color:P.pink },
  { name:'UPTOWN', yStart:12, yEnd:22, color:P.blue },
  { name:'SOUTH MPLS', yStart:22, yEnd:32, color:P.violet },
  { name:'RICHFIELD', yStart:32, yEnd:42, color:P.amber },
  { name:'BLOOMINGTON', yStart:42, yEnd:56, color:P.green },
  { name:'BURNSVILLE', yStart:56, yEnd:72, color:P.pink },
  { name:'APPLE VALLEY', yStart:72, yEnd:86, color:P.blue },
  { name:'LAKEVILLE', yStart:86, yEnd:100, color:P.amber },
];

// Landmarks
const LANDMARKS = [
  { name:'US Bank Stadium', city:'Downtown', gx:18, gy:3, w:4, h:3, color:'#6B3FA0', type:'Stadium' },
  { name:'IDS Tower', city:'Downtown', gx:20, gy:5, w:2, h:2, color:'#4a90c8', type:'Skyscraper' },
  { name:'Target Center', city:'Downtown', gx:16, gy:6, w:3, h:2, color:'#c62828', type:'Arena' },
  { name:'First Avenue', city:'Downtown', gx:15, gy:4, w:2, h:1, color:'#222', type:'Music Venue' },
  { name:'Stone Arch Bridge', city:'Downtown', gx:22, gy:2, w:4, h:1, color:'#8B7355', type:'Bridge' },
  { name:'BlackRoad HQ', city:'Downtown', gx:19, gy:8, w:3, h:2, color:P.pink, type:'HQ' },
  { name:'Nicollet Mall', city:'Downtown', gx:20, gy:7, w:1, h:4, color:'#ddd', type:'Street' },

  { name:'Walker Art Center', city:'Uptown', gx:14, gy:14, w:3, h:2, color:'#8844FF', type:'Museum' },
  { name:'Bde Maka Ska', city:'Uptown', gx:10, gy:16, w:5, h:5, color:'#1565C0', type:'Lake', isLake:true },
  { name:'Lake Harriet', city:'Uptown', gx:10, gy:22, w:4, h:4, color:'#1565C0', type:'Lake', isLake:true },
  { name:'Lake of the Isles', city:'Uptown', gx:12, gy:13, w:3, h:3, color:'#1976D2', type:'Lake', isLake:true },

  { name:'Minnehaha Falls', city:'South Mpls', gx:26, gy:26, w:3, h:2, color:'#0D47A1', type:'Park' },
  { name:'Lake Nokomis', city:'South Mpls', gx:24, gy:28, w:4, h:3, color:'#1565C0', type:'Lake', isLake:true },
  { name:'Fort Snelling', city:'South Mpls', gx:12, gy:30, w:4, h:3, color:'#5D4037', type:'Historic' },

  { name:'Wood Lake', city:'Richfield', gx:14, gy:36, w:3, h:2, color:'#1976D2', type:'Lake', isLake:true },
  { name:'Best Buy HQ', city:'Richfield', gx:18, gy:34, w:3, h:2, color:'#0D47A1', type:'Office' },

  { name:'Mall of America', city:'Bloomington', gx:22, gy:46, w:6, h:5, color:'#E65100', type:'Mall' },
  { name:'MSP Airport', city:'Bloomington', gx:10, gy:44, w:8, h:4, color:'#37474F', type:'Airport' },
  { name:'Hyland Lake', city:'Bloomington', gx:8, gy:50, w:3, h:3, color:'#1565C0', type:'Lake', isLake:true },
  { name:'Bush Lake', city:'Bloomington', gx:6, gy:48, w:3, h:2, color:'#1976D2', type:'Lake', isLake:true },

  { name:'Burnsville Center', city:'Burnsville', gx:18, gy:60, w:4, h:3, color:'#795548', type:'Mall' },
  { name:'Buck Hill', city:'Burnsville', gx:14, gy:64, w:3, h:3, color:'#2E7D32', type:'Ski Area' },
  { name:'Crystal Lake', city:'Burnsville', gx:22, gy:62, w:3, h:3, color:'#1565C0', type:'Lake', isLake:true },

  { name:'Minnesota Zoo', city:'Apple Valley', gx:24, gy:76, w:5, h:4, color:'#1B5E20', type:'Zoo' },
  { name:'Lebanon Hills', city:'Apple Valley', gx:28, gy:78, w:4, h:4, color:'#33691E', type:'Park' },

  { name:'Lake Marion', city:'Lakeville', gx:16, gy:90, w:4, h:4, color:'#1565C0', type:'Lake', isLake:true },
  { name:'Orchard Lake', city:'Lakeville', gx:22, gy:92, w:3, h:2, color:'#1976D2', type:'Lake', isLake:true },
  { name:'Airlake Airport', city:'Lakeville', gx:26, gy:94, w:4, h:2, color:'#455A64', type:'Airport' },
  { name:'Ritter Farm Park', city:'Lakeville', gx:12, gy:96, w:3, h:3, color:'#388E3C', type:'Park' },
];

// ── GENERATE TERRAIN ──
function genTerrain() {
  // Fill with grass / suburb depending on city density
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const city = CITIES.find(c => y >= c.yStart && y < c.yEnd);
      if (city && y < 32) terrain[y * MAP_W + x] = (Math.random() < 0.15) ? 3 : 0;
      else terrain[y * MAP_W + x] = (Math.random() < 0.08) ? 6 : 0;
    }
  }

  // I-35W highway (center spine)
  for (let y = 0; y < MAP_H; y++) {
    terrain[y * MAP_W + 19] = 5;
    terrain[y * MAP_W + 20] = 5;
  }

  // I-494 (east-west at Bloomington)
  for (let x = 0; x < MAP_W; x++) {
    terrain[42 * MAP_W + x] = 5;
  }

  // Highway 62 Crosstown
  for (let x = 5; x < 35; x++) {
    terrain[35 * MAP_W + x] = 5;
  }

  // County Road 42
  for (let x = 5; x < 35; x++) {
    terrain[68 * MAP_W + x] = 5;
  }

  // Local roads (grid)
  for (let y = 0; y < MAP_H; y += 8) {
    for (let x = 5; x < 35; x++) {
      if (terrain[y * MAP_W + x] === 0) terrain[y * MAP_W + x] = 1;
    }
  }
  for (let x = 5; x < 35; x += 6) {
    for (let y = 0; y < MAP_H; y++) {
      if (terrain[y * MAP_W + x] === 0) terrain[y * MAP_W + x] = 1;
    }
  }

  // Landmarks
  for (const lm of LANDMARKS) {
    for (let dy = 0; dy < lm.h; dy++) {
      for (let dx = 0; dx < lm.w; dx++) {
        const mx = lm.gx + dx, my = lm.gy + dy;
        if (mx < MAP_W && my < MAP_H) {
          terrain[my * MAP_W + mx] = lm.isLake ? 2 : 3;
        }
      }
    }
  }
}
genTerrain();

// ── CAMERA ──
const cam = { x: 0, y: 500, zoom: 1.5, tx: 0, ty: 500, tz: 1.5 };
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

C.addEventListener('wheel', e => {
  e.preventDefault();
  cam.tz = Math.max(0.5, Math.min(4, cam.tz - e.deltaY * 0.002));
}, { passive: false });

let drag = false, lastM = {x:0,y:0};
C.addEventListener('mousedown', e => { drag = true; lastM = {x:e.clientX,y:e.clientY}; });
C.addEventListener('mousemove', e => {
  if (drag) {
    cam.tx -= (e.clientX - lastM.x) / cam.zoom;
    cam.ty -= (e.clientY - lastM.y) / cam.zoom;
    lastM = {x:e.clientX,y:e.clientY};
  }
  checkHover(e);
});
C.addEventListener('mouseup', () => drag = false);
C.addEventListener('mouseleave', () => drag = false);
C.addEventListener('click', e => {
  const lm = getLandmarkAt(e);
  if (lm) showLocationPanel(lm);
});

// ── HOVER ──
let hoverLM = null;
function checkHover(e) {
  const lm = getLandmarkAt(e);
  const tt = document.getElementById('tooltip');
  if (lm) {
    hoverLM = lm;
    tt.style.display = 'block';
    tt.style.left = (e.clientX + 12) + 'px';
    tt.style.top = (e.clientY - 8) + 'px';
    tt.innerHTML = `<span style="color:${lm.color};font-weight:700">${lm.name}</span> <span style="opacity:0.5">· ${lm.type}</span>`;
    C.style.cursor = 'pointer';
  } else {
    hoverLM = null;
    tt.style.display = 'none';
    C.style.cursor = 'crosshair';
  }
}

function getLandmarkAt(e) {
  const z = cam.zoom;
  const sx = (e.clientX - W/2) / z + cam.x;
  const sy = (e.clientY - H/2) / z + cam.y;
  for (const lm of LANDMARKS) {
    const s1 = toScreen(lm.gx, lm.gy);
    const s2 = toScreen(lm.gx + lm.w, lm.gy + lm.h);
    const cx = (s1.x + s2.x) / 2, cy = (s1.y + s2.y) / 2;
    const hw = Math.abs(s2.x - s1.x) / 2 + ISO_W;
    const hh = Math.abs(s2.y - s1.y) / 2 + ISO_H * 2;
    if (Math.abs(sx - cx) < hw && Math.abs(sy - cy) < hh) return lm;
  }
  return null;
}

function showLocationPanel(lm) {
  const p = document.getElementById('location-panel');
  p.style.display = 'block';
  document.getElementById('lp-city').textContent = lm.name;
  document.getElementById('lp-city').style.color = lm.color;
  document.getElementById('lp-landmark').textContent = `${lm.city} · ${lm.type}`;
  document.getElementById('lp-type').textContent = lm.type;
  document.getElementById('lp-nodes').textContent = Math.floor(Math.random() * 50 + 5);
}

// ── RESIZE ──
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  C.width = W * dpr; C.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── TILE COLORS ──
function tileCol(type, x, y, t) {
  switch(type) {
    case 0: // grass
      return (x+y)%3===0 ? '#1a3a1a' : (x*y)%7===0 ? '#1e4020' : '#163618';
    case 1: // road
      return '#1a1c24';
    case 2: // water
      const wave = Math.sin(t * 2 + x * 0.5 + y * 0.3) * 0.05;
      const b = 40 + Math.floor(wave * 255);
      return `rgb(15,${30+b},${80+b})`;
    case 3: // building
      return '#181c28';
    case 4: // park
      return (x+y)%2===0 ? '#1a4a22' : '#1e5228';
    case 5: // highway
      return '#10121a';
    case 6: // suburb
      return (x+y)%5===0 ? '#1c2818' : '#141e14';
    default: return '#0a1628';
  }
}

// ── DRAW ISOMETRIC TILE ──
function drawIsoTile(gx, gy, color, height) {
  const s = toScreen(gx, gy);
  const hw = ISO_W / 2, hh = ISO_H / 2;

  // Top face
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(s.x, s.y - hh - (height || 0));
  ctx.lineTo(s.x + hw, s.y - (height || 0));
  ctx.lineTo(s.x, s.y + hh - (height || 0));
  ctx.lineTo(s.x - hw, s.y - (height || 0));
  ctx.closePath();
  ctx.fill();

  if (height > 0) {
    // Right face
    ctx.fillStyle = darken(color, 30);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + hh - height);
    ctx.lineTo(s.x + hw, s.y - height);
    ctx.lineTo(s.x + hw, s.y);
    ctx.lineTo(s.x, s.y + hh);
    ctx.closePath();
    ctx.fill();

    // Left face
    ctx.fillStyle = darken(color, 50);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + hh - height);
    ctx.lineTo(s.x - hw, s.y - height);
    ctx.lineTo(s.x - hw, s.y);
    ctx.lineTo(s.x, s.y + hh);
    ctx.closePath();
    ctx.fill();
  }
}

function darken(hex, amt) {
  if (hex.startsWith('rgb')) return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n >> 16) - amt);
  const g = Math.max(0, ((n >> 8) & 0xFF) - amt);
  const b = Math.max(0, (n & 0xFF) - amt);
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

// ── GAME LOOP ──
let time = 0;

function update(dt) {
  time += dt;
  const spd = 300 / cam.zoom;
  if (keys['ArrowLeft']||keys['a']||keys['A']) cam.tx -= spd * dt;
  if (keys['ArrowRight']||keys['d']||keys['D']) cam.tx += spd * dt;
  if (keys['ArrowUp']||keys['w']||keys['W']) cam.ty -= spd * dt;
  if (keys['ArrowDown']||keys['s']||keys['S']) cam.ty += spd * dt;
  cam.x += (cam.tx - cam.x) * 0.12;
  cam.y += (cam.ty - cam.y) * 0.12;
  cam.zoom += (cam.tz - cam.zoom) * 0.12;

  // Find current city
  const centerGrid = toGrid(cam.x, cam.y);
  const city = CITIES.find(c => centerGrid.y >= c.yStart && centerGrid.y < c.yEnd);
  if (city) document.getElementById('hud-city').textContent = city.name;
  document.getElementById('hud-pos').textContent = `${centerGrid.x}, ${centerGrid.y}`;
}

function render() {
  const z = cam.zoom;
  ctx.fillStyle = '#0a1628';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W/2 - cam.x * z, H/2 - cam.y * z);
  ctx.scale(z, z);

  // Visible range (approximate)
  const viewW = W / z / ISO_W * 2 + 10;
  const viewH = H / z / ISO_H * 2 + 10;
  const centerG = toGrid(cam.x, cam.y);
  const gx0 = Math.max(0, centerG.x - Math.floor(viewW));
  const gy0 = Math.max(0, centerG.y - Math.floor(viewH));
  const gx1 = Math.min(MAP_W, centerG.x + Math.ceil(viewW));
  const gy1 = Math.min(MAP_H, centerG.y + Math.ceil(viewH));

  // Draw tiles (back to front for isometric)
  for (let gy = gy0; gy < gy1; gy++) {
    for (let gx = gx0; gx < gx1; gx++) {
      const t = terrain[gy * MAP_W + gx];
      drawIsoTile(gx, gy, tileCol(t, gx, gy, time), 0);
    }
  }

  // Draw landmarks with height
  for (const lm of LANDMARKS) {
    if (lm.gx + lm.w < gx0 || lm.gx > gx1 || lm.gy + lm.h < gy0 || lm.gy > gy1) continue;

    const height = lm.isLake ? 0 : (lm.type === 'Skyscraper' ? 40 : lm.type === 'Stadium' ? 20 :
      lm.type === 'Mall' ? 15 : lm.type === 'Airport' ? 8 : lm.type === 'Arena' ? 16 : 10);

    for (let dy = 0; dy < lm.h; dy++) {
      for (let dx = 0; dx < lm.w; dx++) {
        if (lm.isLake) {
          drawIsoTile(lm.gx + dx, lm.gy + dy, tileCol(2, lm.gx+dx, lm.gy+dy, time), 0);
        } else {
          drawIsoTile(lm.gx + dx, lm.gy + dy, lm.color, height);
        }
      }
    }

    // Label
    if (z > 0.8) {
      const center = toScreen(lm.gx + lm.w/2, lm.gy + lm.h/2);
      ctx.save();
      ctx.font = `bold ${Math.max(5, Math.min(8, z * 5))}px 'JetBrains Mono'`;
      ctx.textAlign = 'center';
      ctx.shadowColor = lm.color;
      ctx.shadowBlur = 4;
      ctx.fillStyle = lm.isLake ? '#4FC3F7' : lm.color;
      ctx.fillText(lm.name, center.x, center.y - height - 4);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Hover glow
    if (hoverLM === lm) {
      const s = toScreen(lm.gx, lm.gy);
      ctx.strokeStyle = P.pink;
      ctx.lineWidth = 1;
      ctx.strokeRect(s.x - ISO_W/2, s.y - height - ISO_H, lm.w * ISO_W/2 + ISO_W, lm.h * ISO_H + height);
    }
  }

  // Highway lane markings
  ctx.fillStyle = '#FF6B2B20';
  for (let gy = gy0; gy < gy1; gy++) {
    if (gy % 2 === 0) {
      const s = toScreen(19, gy);
      ctx.fillRect(s.x - 1, s.y - 1, 2, 2);
    }
  }

  // City boundary labels
  for (const city of CITIES) {
    if (city.yStart < gy0 - 5 || city.yStart > gy1 + 5) continue;
    const s = toScreen(2, city.yStart);
    ctx.save();
    ctx.font = `bold 6px Orbitron`;
    ctx.fillStyle = city.color + '80';
    ctx.textAlign = 'left';
    ctx.fillText(city.name, s.x - 60, s.y);
    ctx.restore();
  }

  ctx.restore();

  // ── MINIMAP ──
  mm.fillStyle = '#0a1628';
  mm.fillRect(0, 0, 60, 200);
  const mmScale = 200 / MAP_H;
  // Cities
  for (const c of CITIES) {
    mm.fillStyle = c.color + '20';
    mm.fillRect(0, c.yStart * mmScale, 60, (c.yEnd - c.yStart) * mmScale);
    mm.fillStyle = c.color + '60';
    mm.font = '4px sans-serif';
    mm.fillText(c.name.split(' ')[0], 2, (c.yStart + 3) * mmScale);
  }
  // Landmarks
  for (const lm of LANDMARKS) {
    mm.fillStyle = lm.color;
    mm.fillRect(lm.gx / MAP_W * 60, lm.gy * mmScale, Math.max(2, lm.w / MAP_W * 60), Math.max(1, lm.h * mmScale));
  }
  // Camera
  const cg = toGrid(cam.x, cam.y);
  mm.fillStyle = '#fff';
  mm.fillRect(cg.x / MAP_W * 60 - 2, cg.y * mmScale - 2, 4, 4);
}

let lastT = 0;
function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.1);
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// Center camera on downtown
const startPos = toScreen(20, 5);
cam.x = cam.tx = startPos.x;
cam.y = cam.ty = startPos.y;

requestAnimationFrame(loop);
</script>
