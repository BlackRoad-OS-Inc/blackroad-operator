<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackRoad Systems — Pave Tomorrow.</title>
    <link rel="icon" type="image/x-icon" href="https://images.blackroad.io/brand/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://images.blackroad.io/brand/blackroad-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://images.blackroad.io/brand/apple-touch-icon.png" />
    <meta property="og:image" content="https://images.blackroad.io/brand/blackroad-icon-512.png" />
<meta name="description" content="BlackRoad OS — Pave Tomorrow. Live node health, service monitoring, incident tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #000; --surface: #060606; --border: #141414;
  --text: #f0f0f0; --dim: #555; --muted: #333;
  --green: #00ff88; --red: #ff3355; --amber: #ffaa00;
  --grotesk: 'Space Grotesk', sans-serif;
  --inter: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
html { background: var(--bg); color: var(--text); }
body { font-family: var(--inter); }
.topbar { height: 2px; position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: linear-gradient(90deg,#FF6B2B,#FF2255,#CC00AA,#8844FF,#4488FF,#00D4FF); }
.container { max-width: 900px; margin: 0 auto; padding: 0 24px; }

nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid var(--border); }
nav .logo { font-family: var(--grotesk); font-weight: 700; font-size: 16px; letter-spacing: -0.03em; }
nav .links { display: flex; gap: 20px; }
nav .links a { font-family: var(--mono); font-size: 11px; color: var(--dim); text-decoration: none; }
nav .links a:hover { color: #fff; }
nav .links a.active { color: #fff; }

.status-banner { margin: 32px 0; padding: 20px 24px; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.status-text { font-family: var(--grotesk); font-size: 18px; font-weight: 600; }
.status-time { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: auto; }

section { padding: 32px 0; }
section h2 { font-family: var(--grotesk); font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 20px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border); }

.infra-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.infra-stat { background: var(--bg); padding: 20px; }
.infra-num { font-family: var(--grotesk); font-size: 28px; font-weight: 700; }
.infra-label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

.node-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.node-card { background: var(--bg); padding: 20px; }
.node-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.node-card-name { font-family: var(--grotesk); font-size: 16px; font-weight: 700; }
.node-card-dot { width: 8px; height: 8px; border-radius: 50%; }
.node-card-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.8; }
.node-card-meta b { color: var(--dim); font-weight: 500; }
.gauge { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.gauge-bar { flex: 1; height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
.gauge-fill { height: 100%; border-radius: 3px; transition: width 0.6s; }
.gauge-label { font-family: var(--mono); font-size: 9px; color: var(--muted); width: 70px; }
.gauge-val { font-family: var(--mono); font-size: 9px; color: var(--dim); width: 40px; text-align: right; }

.svc-list { border: 1px solid var(--border); }
.svc-row { display: flex; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); gap: 12px; }
.svc-row:last-child { border-bottom: none; }
.svc-icon { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.svc-label { font-family: var(--inter); font-size: 13px; font-weight: 500; }
.svc-detail { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: auto; }
.svc-badge { font-family: var(--mono); font-size: 9px; padding: 2px 8px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
.svc-badge.ok { color: var(--green); border: 1px solid #00ff8833; }
.svc-badge.degraded { color: var(--amber); border: 1px solid #ffaa0033; }
.svc-badge.down { color: var(--red); border: 1px solid #ff335533; }

.analytics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.analytics-stat { background: var(--bg); padding: 16px; text-align: center; }
.analytics-num { font-family: var(--grotesk); font-size: 24px; font-weight: 700; }
.analytics-label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

.cron-table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); }
.cron-table th, .cron-table td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.cron-table th { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; background: var(--surface); }
.cron-table td { font-family: var(--mono); font-size: 11px; color: var(--dim); }

.incident { padding: 16px 20px; border-left: 2px solid var(--amber); margin-bottom: 12px; background: var(--surface); }
.incident.resolved { border-left-color: var(--green); }
.incident-title { font-family: var(--inter); font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.incident-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.incident-body { font-family: var(--inter); font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.6; }
.incident-badge { font-family: var(--mono); font-size: 9px; padding: 2px 8px; border-radius: 2px; display: inline-block; margin-left: 8px; }
.incident-badge.resolved { color: var(--green); border: 1px solid #00ff8833; }
.incident-badge.investigating { color: var(--amber); border: 1px solid #ffaa0033; }

footer { padding: 32px 0; border-top: 1px solid var(--border); margin-top: 40px;
  font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; }

@media (max-width: 640px) {
  .infra-grid { grid-template-columns: repeat(2, 1fr); }
  .node-grid { grid-template-columns: 1fr; }
  .analytics-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
  <script src="https://blackroad-mesh.amundsonalexa.workers.dev/mesh.js" defer></script>
</head>
<body>
<div class="topbar"></div>

<div class="container">
<nav>
  <div class="logo">BlackRoad Systems</div>
  <div class="links">
    <a href="https://blackroad.io">Platform</a>
    <a href="https://blackroad.network">Network</a>
    <a href="https://blackroad.systems" class="active">Systems</a>
    <a href="https://backlog.blackroad.io">Backlog</a>
  </div>
</nav>

<div class="status-banner" id="status-banner">
  <div class="status-dot" id="status-dot" style="background:var(--muted)"></div>
  <div class="status-text" id="status-text">Loading...</div>
  <div class="status-time" id="clock"></div>
</div>

<section>
  <h2>Infrastructure</h2>
  <div class="infra-grid" id="infra-grid"></div>
</section>

<section>
  <h2>Node Health</h2>
  <div class="node-grid" id="node-grid"><div style="padding:20px;font-family:var(--mono);font-size:11px;color:var(--muted)">Loading...</div></div>
</section>

<section>
  <h2>Services</h2>
  <div class="svc-list" id="services"><div style="padding:20px;font-family:var(--mono);font-size:11px;color:var(--muted)">Loading...</div></div>
</section>

<section>
  <h2>Web Analytics <span style="font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400">24h</span></h2>
  <div class="analytics-row" id="analytics-row">
    <div class="analytics-stat"><div class="analytics-num" id="a-views">—</div><div class="analytics-label">Page Views</div></div>
    <div class="analytics-stat"><div class="analytics-num" id="a-sessions">—</div><div class="analytics-label">Sessions</div></div>
    <div class="analytics-stat"><div class="analytics-num" id="a-events">—</div><div class="analytics-label">Events</div></div>
    <div class="analytics-stat"><div class="analytics-num" id="a-countries">—</div><div class="analytics-label">Countries</div></div>
  </div>
</section>

<section>
  <h2>Automation</h2>
  <table class="cron-table">
    <thead><tr><th>Schedule</th><th>Task</th><th>Node</th></tr></thead>
    <tbody id="cron-body"></tbody>
  </table>
</section>

<section>
  <h2>Recent Incidents</h2>
  <div id="incidents"></div>
</section>

<footer id="footer">
  <div>BlackRoad Systems · Loading...</div>
</footer>
</div>

<script>
const STATS_URL = 'https://stats-blackroad.amundsonalexa.workers.dev';

// Clock
function tick() {
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleString('en-US', {
    hour12: false, year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}
tick(); setInterval(tick, 1000);

// Service definitions (what to check on which node)
const SVC_DEFS = [
  { name: 'Cloudflare Pages', detail: () => `${window._infra?.cf_pages || '?'} sites`, static: true, status: 'ok' },
  { name: 'Cloudflare Workers', detail: () => 'Workers + D1 + KV', static: true, status: 'ok' },
  { name: 'Pi-hole DNS', node: 'Alice', port: 'dns', detail: () => 'Alice :53' },
  { name: 'Nginx Reverse Proxy', node: 'Alice', port: 'nginx', detail: () => 'Alice :80' },
  { name: 'PostgreSQL', node: 'Alice', port: 'postgres', detail: () => 'Alice + Cecilia' },
  { name: 'Ollama AI', node: 'Cecilia', port: 'ollama', detail: n => `${n?.ollama_models || '?'} models fleet-wide` },
  { name: 'CECE API', node: 'Cecilia', port: 'ollama', detail: () => 'Cecilia :8100' },
  { name: 'MinIO S3', node: 'Cecilia', port: 'minio', detail: () => 'Cecilia :9000' },
  { name: 'Gitea', node: 'Octavia', port: 'gitea', detail: () => `${window._infra?.gitea_repos || 207} repos · Octavia :3100` },
  { name: 'Docker Swarm', node: 'Octavia', port: 'nats', detail: () => 'Octavia leader' },
  { name: 'Portainer', node: 'Aria', port: 'portainer', detail: () => 'Aria :9443' },
  { name: 'Headscale VPN', node: 'Aria', port: 'portainer', detail: () => 'Aria :8080' },
  { name: 'Lucidia API', node: 'Lucidia', port: 'ollama', detail: () => 'FastAPI :8000' },
  { name: 'GitHub Actions', node: 'Lucidia', static: true, status: 'ok', detail: () => 'Lucidia runners' },
  { name: 'Stats Proxy', node: 'Cecilia', port: 'stats-proxy', detail: () => 'All nodes :7890' },
  { name: 'Analytics Worker', static: true, status: 'ok', detail: () => 'D1 capture · 0 cookies' },
  { name: 'Cloudflare Tunnels', detail: () => `${window._infra?.tunnel_hostnames || '?'} hostnames`, check: () => {
    const nodes = window._fleetNodes || [];
    const tunnelNodes = ['Alice','Cecilia','Octavia','Lucidia'];
    const up = tunnelNodes.filter(tn => nodes.find(n => n.name === tn && n.status === 'online')).length;
    return up === tunnelNodes.length ? 'ok' : up > 0 ? 'degraded' : 'down';
  }},
  { name: 'WireGuard Mesh', detail: () => '10.8.0.0/24 · Anastasia hub', check: () => {
    const online = (window._fleetNodes || []).filter(n => n.status === 'online').length;
    return online >= 4 ? 'ok' : online >= 2 ? 'degraded' : 'down';
  }},
];

async function loadAll() {
  try {
    const res = await fetch(`${STATS_URL}/all`);
    const data = await res.json();
    const fleet = data.fleet?.data || {};
    const infra = data.infra?.data || {};
    const gh = data.github || {};
    const analytics = data.analytics || {};

    window._fleetNodes = fleet.nodes || [];
    window._infra = infra;

    renderStatus(fleet);
    renderInfra(infra, gh, fleet);
    renderNodes(fleet.nodes || []);
    renderServices(fleet.nodes || []);
    renderAnalytics(analytics);
    renderIncidents(fleet.nodes || []);

    const ts = data.fleet?.updated_at || '';
    document.getElementById('footer').innerHTML =
      `<div>BlackRoad OS — Pave Tomorrow. · ${fleet.online || '?'}/${fleet.total || 5} nodes · Data from ${ts ? new Date(ts).toLocaleTimeString() : 'unknown'} · Auto-refreshes 60s</div>`;
  } catch (err) {
    document.getElementById('status-text').textContent = 'Failed to load data';
    document.getElementById('status-dot').style.background = 'var(--red)';
  }
}

function renderStatus(fleet) {
  const online = fleet.online || 0;
  const total = fleet.total || 5;
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (online === total) {
    dot.style.background = 'var(--green)'; text.textContent = 'All Systems Operational';
  } else if (online > 0) {
    dot.style.background = 'var(--amber)'; text.textContent = `Partial Outage — ${online}/${total} nodes`;
  } else {
    dot.style.background = 'var(--red)'; text.textContent = 'Major Outage';
  }
}

function renderInfra(infra, gh, fleet) {
  const items = [
    { num: `${fleet.online || 0}/${fleet.total || 5}`, label: 'Nodes Online' },
    { num: infra.tops_compute || 52, label: 'TOPS AI' },
    { num: fleet.total_ollama_models || infra.ollama_models || 0, label: 'Ollama Models' },
    { num: fleet.total_tcp_ports || infra.open_ports || 0, label: 'TCP Ports' },
    { num: gh.non_fork_repos || '?', label: 'GitHub Repos' },
    { num: infra.gitea_repos || 207, label: 'Gitea Repos' },
    { num: infra.cf_pages || 95, label: 'Pages Sites' },
    { num: infra.cf_d1 || 8, label: 'D1 Databases' },
    { num: infra.cf_kv || 40, label: 'KV Namespaces' },
    { num: infra.cf_r2 || 10, label: 'R2 Buckets' },
    { num: infra.cf_tunnels || 18, label: 'CF Tunnels' },
    { num: infra.domains || 48, label: 'Domains' },
    { num: infra.sqlite_dbs || 228, label: 'SQLite DBs' },
    { num: fleet.total_containers || 0, label: 'Containers' },
    { num: infra.wireguard_peers || 6, label: 'WG Peers' },
    { num: infra.cron_jobs || 13, label: 'Cron Jobs' },
  ];
  document.getElementById('infra-grid').innerHTML = items.map(i =>
    `<div class="infra-stat"><div class="infra-num">${i.num}</div><div class="infra-label">${i.label}</div></div>`
  ).join('');
}

function renderNodes(nodes) {
  const grid = document.getElementById('node-grid');
  grid.innerHTML = '';
  nodes.forEach(n => {
    const up = n.status === 'online';
    const diskColor = n.disk_pct > 85 ? 'var(--red)' : n.disk_pct > 70 ? 'var(--amber)' : 'var(--green)';
    const tempColor = n.cpu_temp > 70 ? 'var(--red)' : n.cpu_temp > 55 ? 'var(--amber)' : 'var(--green)';
    const memPct = n.mem_total_mb > 0 ? Math.round(n.mem_used_mb / n.mem_total_mb * 100) : 0;
    const memColor = memPct > 90 ? 'var(--red)' : memPct > 75 ? 'var(--amber)' : 'var(--green)';

    grid.innerHTML += `<div class="node-card">
      <div class="node-card-header">
        <div class="node-card-dot" style="background:${up?'var(--green)':'var(--red)'};box-shadow:0 0 6px ${up?'#00ff8844':'#ff335544'}"></div>
        <div class="node-card-name">${n.name}</div>
      </div>
      ${up ? `
      <div class="node-card-meta">
        <b>${n.host}</b> · ${n.uptime || ''} uptime · <b>${n.ollama_models}</b> models
      </div>
      <div class="gauge"><div class="gauge-label">CPU Temp</div><div class="gauge-bar"><div class="gauge-fill" style="width:${Math.min(n.cpu_temp,100)}%;background:${tempColor}"></div></div><div class="gauge-val" style="color:${tempColor}">${n.cpu_temp}°C</div></div>
      <div class="gauge"><div class="gauge-label">RAM</div><div class="gauge-bar"><div class="gauge-fill" style="width:${memPct}%;background:${memColor}"></div></div><div class="gauge-val">${memPct}%</div></div>
      <div class="gauge"><div class="gauge-label">Disk</div><div class="gauge-bar"><div class="gauge-fill" style="width:${n.disk_pct}%;background:${diskColor}"></div></div><div class="gauge-val" style="color:${diskColor}">${n.disk_pct}%</div></div>
      ` : `<div class="node-card-meta" style="color:var(--red)">Offline · ${n.host}</div>`}
    </div>`;
  });
}

function renderServices(nodes) {
  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.name] = n; });
  const svcList = document.getElementById('services');
  svcList.innerHTML = '';

  SVC_DEFS.forEach(svc => {
    let status;
    if (svc.check) {
      status = svc.check();
    } else if (svc.static) {
      status = svc.status || 'ok';
    } else if (svc.node) {
      const node = nodeMap[svc.node];
      if (!node || node.status !== 'online') {
        status = 'down';
      } else if (svc.port) {
        status = (node.services || '').includes(svc.port) ? 'ok' : 'down';
      } else {
        status = 'ok';
      }
    } else {
      status = 'ok';
    }

    const node = svc.node ? nodeMap[svc.node] : null;
    const label = status === 'ok' ? 'Operational' : status === 'degraded' ? 'Degraded' : 'Offline';

    svcList.innerHTML += `<div class="svc-row">
      <div class="svc-icon" style="background:var(--${status === 'ok' ? 'green' : status === 'degraded' ? 'amber' : 'red'})"></div>
      <div class="svc-label">${svc.name}</div>
      <div class="svc-detail">${svc.detail(node)}</div>
      <div class="svc-badge ${status}">${label}</div>
    </div>`;
  });
}

function renderAnalytics(a) {
  if (!a) return;
  document.getElementById('a-views').textContent = a.views ?? '—';
  document.getElementById('a-sessions').textContent = a.unique_sessions ?? '—';
  document.getElementById('a-events').textContent = a.events ?? '—';
  document.getElementById('a-countries').textContent = a.countries?.length ?? '—';
}

function renderIncidents(nodes) {
  // Dynamic incidents based on node status
  const incidents = [];
  nodes.forEach(n => {
    if (n.status === 'offline') {
      incidents.push({
        title: `${n.name} offline — needs physical reboot`,
        date: 'Ongoing',
        status: 'investigating',
        body: `${n.name} (${n.host}) is not responding to SSH. Needs physical power cycle.`
      });
    }
    if (n.status === 'online' && n.cpu_temp > 65) {
      incidents.push({
        title: `${n.name} running hot — ${n.cpu_temp}°C`,
        date: 'Active',
        status: 'investigating',
        body: `CPU temperature at ${n.cpu_temp}°C. Monitoring for throttling.`
      });
    }
    if (n.status === 'online' && n.disk_pct > 85) {
      incidents.push({
        title: `${n.name} disk space critical — ${n.disk_pct}%`,
        date: 'Active',
        status: 'investigating',
        body: `Disk usage at ${n.disk_pct}%. Needs cleanup to prevent service degradation.`
      });
    }
    if (n.status === 'online' && n.mem_total_mb > 0 && (n.mem_used_mb / n.mem_total_mb) > 0.9) {
      incidents.push({
        title: `${n.name} memory pressure — ${Math.round(n.mem_used_mb/n.mem_total_mb*100)}%`,
        date: 'Active',
        status: 'investigating',
        body: `RAM at ${n.mem_used_mb}/${n.mem_total_mb}MB. May need service restarts.`
      });
    }
  });

  // Static resolved incidents
  incidents.push(
    { title: 'Lucidia overheating — world-engine disabled', date: 'Mar 9, 2026', status: 'resolved',
      body: 'world-engine.py calling Ollama nonstop = 73°C. Service disabled → 58°C.' },
    { title: 'Cecilia undervoltage — power optimization', date: 'Mar 9, 2026', status: 'resolved',
      body: 'CPU capped 2.0GHz, governor=conservative. Throttle 0x50000 → 0x0.' },
    { title: 'Cecilia obfuscated cron removed', date: 'Mar 8, 2026', status: 'resolved',
      body: 'Dropper cron executing /tmp/op.py removed. No payload found.' },
  );

  const div = document.getElementById('incidents');
  div.innerHTML = incidents.map(inc => `
    <div class="incident ${inc.status === 'resolved' ? 'resolved' : ''}">
      <div class="incident-title">${inc.title}
        <span class="incident-badge ${inc.status}">${inc.status}</span>
      </div>
      <div class="incident-meta">${inc.date}</div>
      <div class="incident-body">${inc.body}</div>
    </div>
  `).join('');
}

// Cron (semi-static — these don't change often)
const CRONS = [
  { sched: '*/1', task: 'Fleet heartbeat', node: 'Cecilia, Octavia' },
  { sched: '*/5', task: 'Fleet collector → stats API', node: 'Mac' },
  { sched: '*/5', task: 'Self-heal check (ollama, stats-proxy)', node: 'Cecilia, Octavia' },
  { sched: '*/5', task: 'Power monitor', node: 'All nodes' },
  { sched: '*/15', task: 'Cecilia sync', node: 'Mac' },
  { sched: '*/30', task: 'GitHub mirror (Gitea → GitHub)', node: 'Cecilia' },
  { sched: '6 AM', task: 'KPI collection + Slack post', node: 'Mac' },
  { sched: '6h', task: 'rclone → Google Drive', node: 'Mac' },
  { sched: '12h', task: 'rsync → Gematria droplet', node: 'Mac' },
  { sched: '3 AM', task: 'Backup sync + sovereign mesh', node: 'Mac' },
  { sched: '30s', task: 'Watchdog (Redis task queue)', node: 'Alice' },
  { sched: '5m', task: 'brnode heartbeat', node: 'Lucidia' },
];
document.getElementById('cron-body').innerHTML = CRONS.map(c =>
  `<tr><td>${c.sched}</td><td>${c.task}</td><td>${c.node}</td></tr>`
).join('');

// Load + auto-refresh
loadAll();
setInterval(loadAll, 60000);
</script>
