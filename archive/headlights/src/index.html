<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Headlights by BlackRoad OS</title>
    <meta name="description" content="Headlights by BlackRoad OS, Inc. — Sovereign VR. See the Road Ahead.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-overlay h1 {
            color: #FF1D6C;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
        }
        #loading-overlay p {
            color: #F5A623;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.05em;
        }
        #loading-overlay .bar {
            width: 200px;
            height: 2px;
            background: #222;
            margin-top: 2rem;
            border-radius: 1px;
            overflow: hidden;
        }
        #loading-overlay .bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FF1D6C, #F5A623);
            animation: load-bar 2s ease forwards;
        }
        @keyframes load-bar {
            to { width: 100%; }
        }
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');
    </style>
</head>
<body>
    <div id="loading-overlay">
        <h1>HEADLIGHTS</h1>
        <p>by BlackRoad OS, Inc.</p>
        <div class="bar"><div class="bar-fill"></div></div>
    </div>

    <a-scene
        vr-mode-ui="enabled: true"
        renderer="antialias: true; colorManagement: true"
        loading-screen="enabled: false"
    >
        <!-- Assets -->
        <a-assets>
            <a-mixin id="glow-pink" material="color: #FF1D6C; emissive: #FF1D6C; emissiveIntensity: 0.6; metalness: 0.8; roughness: 0.2"></a-mixin>
            <a-mixin id="glow-amber" material="color: #F5A623; emissive: #F5A623; emissiveIntensity: 0.6; metalness: 0.8; roughness: 0.2"></a-mixin>
        </a-assets>

        <!-- Black sky -->
        <a-sky color="#050505"></a-sky>

        <!-- Ground: dark grid -->
        <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="100"
            height="100"
            material="color: #0a0a0a; metalness: 0.9; roughness: 0.1"
        ></a-plane>

        <!-- Grid lines on ground -->
        <a-entity id="grid">
            <a-plane position="0 0.01 0" rotation="-90 0 0" width="100" height="100"
                     material="src: #grid-texture; repeat: 50 50; transparent: true; opacity: 0.15; color: #FF1D6C">
            </a-plane>
        </a-entity>

        <!-- Main title: HEADLIGHTS -->
        <a-text
            value="HEADLIGHTS"
            position="0 3.5 -6"
            align="center"
            color="#FF1D6C"
            font="mozillavr"
            width="12"
            shader="msdf"
            anchor="center"
        ></a-text>

        <!-- Subtitle -->
        <a-text
            value="by BlackRoad OS, Inc."
            position="0 2.8 -6"
            align="center"
            color="#F5A623"
            font="mozillavr"
            width="6"
            shader="msdf"
            anchor="center"
        ></a-text>

        <!-- Tagline -->
        <a-text
            value="See the Road Ahead."
            position="0 2.2 -6"
            align="center"
            color="#FFFFFF"
            font="mozillavr"
            width="4"
            shader="msdf"
            anchor="center"
            opacity="0.7"
        ></a-text>

        <!-- Pink accent ring (outer) -->
        <a-torus
            position="0 2.8 -6"
            rotation="0 0 0"
            radius="2.5"
            radius-tubular="0.015"
            segments-radial="64"
            segments-tubular="12"
            mixin="glow-pink"
            animation="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true"
        ></a-torus>

        <!-- Amber accent ring (inner, tilted) -->
        <a-torus
            position="0 2.8 -6"
            rotation="30 0 60"
            radius="1.8"
            radius-tubular="0.012"
            segments-radial="64"
            segments-tubular="12"
            mixin="glow-amber"
            animation="property: rotation; to: 30 360 60; dur: 15000; easing: linear; loop: true"
        ></a-torus>

        <!-- Floating orbs: pink -->
        <a-sphere position="-4 1.5 -8" radius="0.15" mixin="glow-pink"
                  animation="property: position; to: -4 2.5 -8; dur: 3000; easing: easeInOutSine; dir: alternate; loop: true"></a-sphere>
        <a-sphere position="5 2 -10" radius="0.1" mixin="glow-pink"
                  animation="property: position; to: 5 3 -10; dur: 4000; easing: easeInOutSine; dir: alternate; loop: true"></a-sphere>
        <a-sphere position="-2 3 -12" radius="0.2" mixin="glow-pink"
                  animation="property: position; to: -2 4 -12; dur: 5000; easing: easeInOutSine; dir: alternate; loop: true"></a-sphere>

        <!-- Floating orbs: amber -->
        <a-sphere position="3 1 -7" radius="0.12" mixin="glow-amber"
                  animation="property: position; to: 3 2 -7; dur: 3500; easing: easeInOutSine; dir: alternate; loop: true"></a-sphere>
        <a-sphere position="-5 2.5 -11" radius="0.18" mixin="glow-amber"
                  animation="property: position; to: -5 3.5 -11; dur: 4500; easing: easeInOutSine; dir: alternate; loop: true"></a-sphere>
        <a-sphere position="6 1.5 -9" radius="0.08" mixin="glow-amber"
                  animation="property: position; to: 6 2.5 -9; dur: 2500; easing: easeInOutSine; dir: alternate; loop: true"></a-sphere>

        <!-- Road pillars (left) -->
        <a-box position="-3 1 -8" width="0.1" height="2" depth="0.1" material="color: #1a1a1a; emissive: #FF1D6C; emissiveIntensity: 0.2"></a-box>
        <a-box position="-3 1 -12" width="0.1" height="2" depth="0.1" material="color: #1a1a1a; emissive: #FF1D6C; emissiveIntensity: 0.2"></a-box>
        <a-box position="-3 1 -16" width="0.1" height="2" depth="0.1" material="color: #1a1a1a; emissive: #FF1D6C; emissiveIntensity: 0.2"></a-box>

        <!-- Road pillars (right) -->
        <a-box position="3 1 -8" width="0.1" height="2" depth="0.1" material="color: #1a1a1a; emissive: #F5A623; emissiveIntensity: 0.2"></a-box>
        <a-box position="3 1 -12" width="0.1" height="2" depth="0.1" material="color: #1a1a1a; emissive: #F5A623; emissiveIntensity: 0.2"></a-box>
        <a-box position="3 1 -16" width="0.1" height="2" depth="0.1" material="color: #1a1a1a; emissive: #F5A623; emissiveIntensity: 0.2"></a-box>

        <!-- Center road stripe -->
        <a-plane position="0 0.02 -10" rotation="-90 0 0" width="0.15" height="12"
                 material="color: #F5A623; emissive: #F5A623; emissiveIntensity: 0.3; opacity: 0.6; transparent: true"></a-plane>

        <!-- Navigation panel: Pixel HQ link -->
        <a-entity position="0 1.5 -4">
            <a-plane width="2.5" height="0.6" material="color: #111; opacity: 0.85; transparent: true" class="clickable"></a-plane>
            <a-text value="Enter Pixel HQ" position="0 0.05 0.01" align="center" color="#FF1D6C" width="3"></a-text>
            <a-text value="hq.blackroad.io" position="0 -0.15 0.01" align="center" color="#666" width="2"></a-text>
        </a-entity>

        <!-- Navigation panel: Fleet Status -->
        <a-entity position="-3 1.5 -4" rotation="0 30 0">
            <a-plane width="2" height="0.6" material="color: #111; opacity: 0.85; transparent: true"></a-plane>
            <a-text value="Fleet Status" position="0 0.05 0.01" align="center" color="#F5A623" width="2.5"></a-text>
            <a-text value="5 Pis Online" position="0 -0.15 0.01" align="center" color="#666" width="2"></a-text>
        </a-entity>

        <!-- Navigation panel: Dashboard -->
        <a-entity position="3 1.5 -4" rotation="0 -30 0">
            <a-plane width="2" height="0.6" material="color: #111; opacity: 0.85; transparent: true"></a-plane>
            <a-text value="Dashboard" position="0 0.05 0.01" align="center" color="#F5A623" width="2.5"></a-text>
            <a-text value=":8100" position="0 -0.15 0.01" align="center" color="#666" width="2"></a-text>
        </a-entity>

        <!-- Lighting -->
        <a-light type="ambient" color="#111" intensity="0.3"></a-light>
        <a-light type="point" color="#FF1D6C" intensity="0.8" position="-3 4 -6" distance="20"></a-light>
        <a-light type="point" color="#F5A623" intensity="0.8" position="3 4 -6" distance="20"></a-light>
        <a-light type="point" color="#2979FF" intensity="0.3" position="0 5 -10" distance="25"></a-light>

        <!-- Camera -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls wasd-controls>
                <a-cursor color="#FF1D6C" fuse="false" raycaster="objects: .clickable"></a-cursor>
            </a-camera>
        </a-entity>
    </a-scene>

    <script>
        // Dismiss loading overlay when scene is loaded
        document.querySelector('a-scene').addEventListener('loaded', function () {
            setTimeout(function () {
                document.getElementById('loading-overlay').classList.add('hidden');
            }, 2200);
        });
    </script>
</body>
</html>
