name = "blackroad-mcp-agent-manager"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "AGENT_REGISTRY"
database_name = "apollo-agent-registry"
database_id = "79f8b80d-3bb5-4dd4-beee-a77a1084b574"

[[kv_namespaces]]
binding = "AGENTS_KV"
id = "28ed114677e54e23ad10cc7901f1fd98"

# Routes
[triggers]
routes = [
  { pattern = "mcp.blackroad.io/*", zone_name = "blackroad.io" },
  { pattern = "agents.blackroad.io/*", zone_name = "blackroad.io" }
]
