# BlackRoad OS Education Pack
# Version: 1.0.0

id: education
key: education
name: Education & Learning Pack
version: 1.0.0
description: >
  Comprehensive education infrastructure for BlackRoad OS.
  Includes agents for personalized learning, curriculum design,
  assessment, tutoring, and student success tracking.

# Pack metadata
icon: graduation-cap
category: education
tier: T1  # Consumer tier with bridges to T2/T5

# Required dependencies
depends_on:
  - blackroad-os-core >=0.1.0
  - blackroad-os-api >=0.1.0

# Agent templates included in this pack
agent_templates:
  - adaptive_tutor
  - curriculum_designer
  - assessment_generator
  - progress_tracker
  - study_planner
  - content_summarizer
  - quiz_master
  - learning_path_optimizer
  - concept_explainer
  - homework_assistant

# Workflows included
workflows:
  - personalized_learning_path
  - course_creation_flow
  - assessment_cycle
  - student_onboarding

# Worker pool configuration
worker_pool:
  name: education-default
  queue_name: jobs.education.default
  min_workers: 1
  max_workers: 20
  target_latency_ms: 3000

# Default configuration
defaults:
  llm:
    model: gpt-4
    temperature: 0.7
  logging:
    level: info
    retain_days: 90
  audit:
    enabled: true
    pii_sensitivity: high  # Education data is sensitive

# Required roles for org members
required_roles:
  - instructor
  - student
  - admin

# Tags for discovery
tags:
  - education
  - learning
  - training
  - curriculum
  - assessment
  - tutoring
  - student-success
  - adaptive-learning
  - personalization
