id: course_launch
description: Launch a new course from goals and constraints.
steps:
  - id: design_syllabus
    agent: edu-syllabus-architect-01
    input: goals
    output: syllabus
  - id: design_assessments
    agent: edu-assessment-designer-01
    input: syllabus.objectives
    output: assessments
  - id: setup_success_monitoring
    agent: edu-student-success-bot-01
    input: course_instance
    output: monitoring_plan
