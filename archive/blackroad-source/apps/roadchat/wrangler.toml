name = "chat-blackroad"
main = "src/worker.js"
compatibility_date = "2024-12-01"
workers_dev = true

routes = [
  { pattern = "chat.blackroad.io/*", zone_name = "blackroad.io" }
]

[vars]
OLLAMA_URL = "https://ollama.blackroad.io"

# Task storage, memory, and background job state
[[kv_namespaces]]
binding = "TASKS"
id = "be621a228a014a0d9499f909a33a60bf"

[[kv_namespaces]]
binding = "MEMORY"
id = "ffc27d471eba446cb49fc84f41531630"
