#hud .controls button:hover{background:rgba(255,29,108,0.2);border-color:#FF1D6C;color:#fff}
#loading{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;color:#fff}
#loading h1{font-size:2rem;margin-bottom:16px}

#loading .fill{height:100%;background:linear-gradient(90deg,#FF1D6C,#9C27B0);width:0%;transition:width 0.3s}

.speech-bubble{position:fixed;z-index:20;pointer-events:none;background:rgba(0,0,0,0.9);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:8px 12px;max-width:240px;font-size:11px;color:#ccc;font-family:'JetBrains Mono',monospace;animation:pop 0.3s ease}
.speech-bubble .name{color:#FF1D6C;font-weight:700;font-size:10px;margin-bottom:2px}

@keyframes pop{from{transform:scale(0.8) translateY(5px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

// Find nearest walkable point to a given position
function clampToWalkable(x, y, floorId) {
  const zones = WALKABLE[floorId];
  if (!zones || !zones.length) return {x, y};
  const sw = app.screen.width, sh = app.screen.height;

  // Check if already in a walkable zone
  for (const z of zones) {
    const zx = z.x * sw, zy = z.y * sh, zw = z.w * sw, zh = z.h * sh;
    if (x >= zx && x <= zx + zw && y >= zy && y <= zy + zh) return {x, y};
  }

  // Find nearest point in any walkable zone
  let best = {x, y}, bestDist = Infinity;
  for (const z of zones) {
    const zx = z.x * sw, zy = z.y * sh, zw = z.w * sw, zh = z.h * sh;
    const cx = Math.max(zx, Math.min(x, zx + zw));
    const cy = Math.max(zy, Math.min(y, zy + zh));
    const d = Math.sqrt((cx - x) ** 2 + (cy - y) ** 2);
    if (d < bestDist) { bestDist = d; best = {x: cx, y: cy}; }
  }
  return best;
}

// Get random point within walkable zones
function randomWalkable(floorId) {
  const zones = WALKABLE[floorId];
  if (!zones || !zones.length) return {x: app.screen.width * 0.5, y: app.screen.height * 0.5};
  const z = zones[Math.floor(Math.random() * zones.length)];
  return {
    x: (z.x + Math.random() * z.w) * app.screen.width,
    y: (z.y + Math.random() * z.h) * app.screen.height
  };
}

// ── Color helpers ──
function darken(c,f){return((((c>>16)&0xFF)*f)<<16)|(((((c>>8)&0xFF)*f))<<8)|((c&0xFF)*f)}
function lighten(c,f){return(Math.min(255,((c>>16)&0xFF)*f)<<16)|(Math.min(255,((c>>8)&0xFF)*f)<<8)|Math.min(255,(c&0xFF)*f)}

// ── Pixel character renderer ──
function drawChar(g,c,hair,frame,state,name){
  g.clear();
  const s=0xFFD5B4,ss=0xE8C0A0,d=0x222233,dl=0x333344,sh=0x333344,w=0xFFFFFF;
  const h=hair||c,hd=darken(h,0.75),cd=darken(c,0.7),cl=lighten(c,1.3);
  const px=(x,y,col)=>{g.rect(x,y,1,1).fill(col)};
  const blink=Math.sin(frame*0.05)>0.95;
  const sit=state==='sitting';
  // Hair
  for(let x=-3;x<=3;x++){px(x,-14,h);px(x,-13,h);px(x,-12,h)}
  px(-4,-13,hd);px(4,-13,hd);px(-4,-12,hd);px(4,-12,hd);
  if(!sit){px(-5,-11,hd);px(5,-11,hd)}
  // Head
  for(let x=-4;x<=4;x++){px(x,-10,x===-4||x===4?ss:s);px(x,-9,x===-4||x===4?ss:s);px(x,-8,x===-4||x===4?ss:s)}
  for(let x=-3;x<=3;x++)px(x,-7,s);
  // Eyes
  if(!blink){px(-3,-9,w);px(-2,-9,w);px(-1,-9,d);px(1,-9,w);px(2,-9,w);px(3,-9,d)}
  else{px(-2,-9,ss);px(-1,-9,ss);px(1,-9,ss);px(2,-9,ss)}
  px(-3,-8,0xFFBBA0);px(3,-8,0xFFBBA0);px(0,-8,ss);// cheeks+nose
  px(-1,-7,0xCC8866);px(0,-7,0xCC8866);// mouth
  // Body
  for(let y=-6;y<=-2;y++){px(-4,y,cd);for(let x=-3;x<=3;x++)px(x,y,c);px(4,y,cd)}
  px(-1,-5,cl);px(0,-5,cl);px(1,-5,cl);// highlight
  px(-2,-6,s);px(-1,-6,s);px(0,-6,s);px(1,-6,s);px(2,-6,s);// collar
  for(let x=-4;x<=4;x++)px(x,-2,cd);px(0,-2,0x888888);// belt
  if(sit){
    // Sitting arms + legs
    px(-5,-4,c);px(-6,-4,c);px(-7,-3,s);px(5,-4,c);px(6,-4,c);px(7,-3,s);
    for(let x=-3;x<=3;x++)px(x,-1,d);
    px(-3,0,sh);px(-2,0,sh);px(2,0,sh);px(3,0,sh);
  } else {
    // Arms
    const as=state==='walking'?Math.round(Math.sin(frame*0.8)):0;
    if(state==='waving'){
      px(-5,-5,c);px(-5,-4,c);px(-5,-3,c);px(-6,-2,s);
      px(5,-5,c);px(5,-6,c);px(5,-7,c);px(6,-8,s);
    } else if(state==='typing'){
      px(-5,-4,c);px(-6,-3,c);px(-7,-2,s);px(5,-4,c);px(6,-3,c);px(7,-2,s);
    } else {
      px(-5,-5,c);px(-5,-4,c);px(-5,-3+as,c);px(-6,-2+as,s);
      px(5,-5,c);px(5,-4,c);px(5,-3-as,c);px(6,-2-as,s);
    }
    // Legs
    if(state==='walking'){
      const p=Math.sin(frame*0.8),l=Math.round(p*2),r=Math.round(-p*2);
      px(-3,-1,d);px(-2,-1,d);px(-3,0+l,d);px(-2,0+l,d);px(-3,1+l,d);px(-2,1+l,dl);
      px(-4,2+l,sh);px(-3,2+l,sh);px(-2,2+l,dl);
      px(2,-1,d);px(3,-1,d);px(2,0+r,d);px(3,0+r,d);px(2,1+r,dl);px(3,1+r,d);
      px(2,2+r,dl);px(3,2+r,sh);px(4,2+r,sh);
    } else {
      px(-3,-1,d);px(-2,-1,d);px(-3,0,d);px(-2,0,d);px(-3,1,d);px(-2,1,dl);
      px(-4,2,sh);px(-3,2,sh);px(-2,2,dl);
      px(2,-1,d);px(3,-1,d);px(2,0,d);px(3,0,d);px(2,1,dl);px(3,1,d);
      px(2,2,dl);px(3,2,sh);px(4,2,sh);
    }
  }
  // Accessories
  if(name==='cecilia'){px(-5,-12,0x666666);px(5,-12,0x666666);px(-5,-11,0x555555);px(5,-11,0x555555);for(let x=-4;x<=4;x++)px(x,-14,0x777777)}
  if(name==='octavia'){px(-3,-10,0x666666);px(-2,-10,0x666666);px(-1,-10,0x666666);px(0,-10,0x666666);px(1,-10,0x666666);px(2,-10,0x666666);px(3,-10,0x666666)}
  if(name==='shellfish'){for(let x=-4;x<=4;x++)px(x,-14,0x222222);px(-5,-13,0x222222);px(5,-13,0x222222)}
  if(name==='caddy'){for(let x=-4;x<=4;x++)px(x,-14,0xFFD700);px(-5,-13,0xDDB600);px(5,-13,0xDDB600)}
  if(name==='lucidia'){px(-3,-13,0x00BCD4);px(-2,-13,0x00BCD4);px(2,-13,0x00BCD4);px(3,-13,0x00BCD4)}
  if(name==='aria'){px(-5,-9,0x2979FF);px(5,-9,0x2979FF)}
  if(name==='alice'&&state==='typing'){px(8,-3,0x444444);px(9,-3,0x444444);px(10,-3,0x444444);px(8,-4,0x4488CC);px(9,-4,0x4488CC);px(10,-4,0x555555)}
  if(name==='alexa'&&state==='walking'){px(7,-2,0x8B4513);px(8,-2,0x8B4513);px(7,-1,0x8B4513);px(8,-1,0x8B4513)}
}

// ── Create agent — clean professional avatar ──
function createAgent(name){
  const c=AC[name]||0x888888;
  const ct=new PIXI.Container();ct.agentName=name;ct.sortableChildren=true;

  // Avatar circle with gradient effect
  const gfx=new PIXI.Graphics();gfx.zIndex=1;
  // Outer glow
  gfx.circle(0,-6,16).fill({color:c,alpha:0.15});
  // Main circle
  gfx.circle(0,-6,12).fill(c);
  // Inner highlight
  gfx.circle(-2,-8,8).fill({color:0xFFFFFF,alpha:0.1});
  ct.addChild(gfx);ct.gfx=gfx;

  // Initial letter
  const initial=new PIXI.Text({text:name[0].toUpperCase(),style:{fontFamily:'Space Grotesk',fontSize:12,fill:0xFFFFFF,fontWeight:'700'}});
  initial.anchor.set(0.5);initial.y=-6;initial.zIndex=2;ct.addChild(initial);

  // Status ring (animated)
  const ring=new PIXI.Graphics();ring.zIndex=3;ct.addChild(ring);ct.ring=ring;

  // Name tag with background
  const tagW=name.length*6+12;
  const tag=new PIXI.Graphics();tag.roundRect(-tagW/2,6,tagW,14,4).fill({color:0x000000,alpha:0.75});tag.zIndex=5;ct.addChild(tag);
  const nt=new PIXI.Text({text:name,style:{fontFamily:'JetBrains Mono',fontSize:8,fill:c}});nt.anchor.set(0.5,0);nt.y=8;nt.zIndex=6;ct.addChild(nt);

  // Role tag (smaller, below name)
  const role=AR[name]||'';
  const rt=new PIXI.Text({text:role,style:{fontFamily:'JetBrains Mono',fontSize:5,fill:0x666666}});rt.anchor.set(0.5,0);rt.y=20;rt.zIndex=6;ct.addChild(rt);ct.roleText=rt;

  // Shadow
  const sh=new PIXI.Graphics();sh.ellipse(0,28,10,3).fill({color:0,alpha:0.12});sh.zIndex=-1;ct.addChild(sh);ct.sh=sh;
  // State
  ct.state='idle';ct.timer=60+Math.random()*120;ct.tx=0;ct.ty=0;
  ct.speed=1.2+Math.random()*0.6;ct.dir=1;ct.frame=Math.random()*100;
  ct.bob=Math.random()*Math.PI*2;ct.color=c;ct.hair=name==='alexa'?0xFF1D6C:c;
  ct.interactTarget=null;ct.codeScreen=null;
  // Click
  ct.eventMode='static';ct.cursor='pointer';ct.hitArea=new PIXI.Rectangle(-12,-16,24,24);
  ct.on('pointerdown',()=>{
    const nd=fleet?.find(n=>n.name?.toLowerCase()===name);
    const info=nd?`${nd.cpu_temp}C | ${nd.disk_pct}% disk | ${nd.ollama_models} models | ${nd.uptime}`:AR[name];
    showBubble(ct,`${name} — ${AR[name]}\n${info}`);
  });
  return ct;
}

// ── Particle ──
class P{
  constructor(x,y,c,vx,vy,life,sz){
    this.g=new PIXI.Graphics();this.g.circle(0,0,sz||2).fill(c||0xFFFFFF);
    this.x=x;this.y=y;this.vx=vx||0;this.vy=vy||-1;this.life=life||60;this.max=this.life;
    this.g.x=x;this.g.y=y;this.g.zIndex=99999;app.stage.addChild(this.g);
  }
  update(dt){
    this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
    this.g.x=this.x;this.g.y=this.y;this.g.alpha=Math.max(0,this.life/this.max);
    if(this.life<=0){app.stage.removeChild(this.g);return false}return true;
  }
}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++)particles.push(new P(x+(Math.random()-.5)*(sp||20),y+(Math.random()-.5)*(sp||10),c,(Math.random()-.5)*1.5,-Math.random()*2-.5,30+Math.random()*30,1+Math.random()*2))}

// ── Emote ──
function emote(a,e){
  const t=new PIXI.Text({text:e,style:{fontSize:14}});t.anchor.set(0.5);t.x=0;t.y=-20;t.zIndex=10;a.addChild(t);
  let tm=0;const tick=(tk)=>{tm+=tk.deltaTime;t.y=-20-tm*0.5;t.alpha=Math.max(0,1-tm/60);if(tm>60){a.removeChild(t);app.ticker.remove(tick)}};
  app.ticker.add(tick);
  // Chain reaction
  if(e==='!'&&Math.random()>0.5)agents.forEach(ag=>{if(ag!==a&&Math.abs(ag.x-a.x)<100)setTimeout(()=>{const t2=new PIXI.Text({text:'!',style:{fontSize:14}});t2.anchor.set(0.5);t2.x=0;t2.y=-20;t2.zIndex=10;ag.addChild(t2);let tm2=0;const tk2=(tk)=>{tm2+=tk.deltaTime;t2.y=-20-tm2*0.5;t2.alpha=Math.max(0,1-tm2/60);if(tm2>60){ag.removeChild(t2);app.ticker.remove(tk2)}};app.ticker.add(tk2)},300+Math.random()*500)});
}

// ── Floor management ──
function goToFloor(idx){
  if(idx<0||idx>=FLOORS.length)return;currentFloor=idx;

  document.querySelectorAll('.speech-bubble').forEach(b=>b.remove());

  const hr=new Date().getHours();
  bgSprite.tint=hr>=6&&hr<9?0xFFE8D0:hr>=9&&hr<17?0xFFFFFF:hr>=17&&hr<20?0xFFD8C0:0x8090B0;
}
function fitBg(){if(!bgSprite?.texture?.width)return;const sx=app.screen.width/bgSprite.texture.width,sy=app.screen.height/bgSprite.texture.height,sc=Math.max(sx,sy);bgSprite.scale.set(sc);bgSprite.x=(app.screen.width-bgSprite.texture.width*sc)/2;bgSprite.y=(app.screen.height-bgSprite.texture.height*sc)/2}
function nextFloor(){goToFloor(Math.min(currentFloor+1,FLOORS.length-1))}
function prevFloor(){goToFloor(Math.max(currentFloor-1,0))}

function spawnAgents(names){
  agents.forEach(a=>app.stage.removeChild(a));agents=[];
  const ps=Math.max(2,Math.min(4,Math.floor(app.screen.height/200)));
  names.forEach((n,i)=>{
    const a=createAgent(n);
    const wp=randomWalkable(FLOORS[currentFloor].id);
    a.x=wp.x;a.y=wp.y;
    a.tx=a.x;a.ty=a.y;a.scale.set(ps);
    app.stage.addChild(a);agents.push(a);
  });
}

// ── MAIN GAME LOOP ──
function gameLoop(ticker){
  const dt=ticker.deltaTime;time+=dt*0.02;

  agents.forEach(a=>{
    a.timer-=dt;a.frame+=dt;

    // State machine
    if(a.timer<=0){
      const r=Math.random();
      if(r<0.2){a.state='walking';const wp=randomWalkable(FLOORS[currentFloor].id);a.tx=wp.x;a.ty=wp.y;a.dir=a.tx>a.x?1:-1;a.timer=999;a.interactTarget=null}
      else if(r<0.35&&agents.length>1){const ot=agents.filter(o=>o!==a);const t=ot[Math.floor(Math.random()*ot.length)];a.state='walking';const tp=clampToWalkable(t.x+(Math.random()>0.5?40:-40),t.y,FLOORS[currentFloor].id);a.tx=tp.x;a.ty=tp.y;a.interactTarget=t;a.timer=999}
      else if(r<0.5){a.state='typing';a.timer=120+Math.random()*200}
      else if(r<0.6){a.state='sitting';a.timer=100+Math.random()*250}
      else if(r<0.65){a.state='waving';a.timer=40}
      else{a.state='idle';a.timer=60+Math.random()*150}
    }

    // Movement
    if(a.state==='walking'){
      const dx=a.tx-a.x,dy=a.ty-a.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>5){
        const nx=a.x+(dx/dist)*a.speed, ny=a.y+(dy/dist)*a.speed;
        const clamped=clampToWalkable(nx,ny,FLOORS[currentFloor].id);
        a.x=clamped.x;a.y=clamped.y;a.dir=dx>0?1:-1;
      }
      else{
        if(a.interactTarget){
          a.state='idle';a.timer=80+Math.random()*120;a.dir=a.interactTarget.x>a.x?1:-1;
          if(a.interactTarget.state!=='walking')a.interactTarget.dir=a.x>a.interactTarget.x?1:-1;
          const convos=[['Hey, status?','All green!'],['Working?','Always.'],['Ship it?','Ship it.']];
          const c=convos[Math.floor(Math.random()*convos.length)];
          setTimeout(()=>showBubble(a,c[0]),500);
          if(a.interactTarget.state!=='walking')setTimeout(()=>showBubble(a.interactTarget,c[1]),2000);
          emote(a,'!');if(a.interactTarget.state!=='walking')emote(a.interactTarget,'!');
          a.interactTarget=null;
        } else{a.state=Math.random()>0.5?'sitting':'typing';a.timer=100+Math.random()*200}
      }
    }

    // Animate avatar ring based on state
    if(a.ring&&Math.floor(a.frame)%8===0){
      a.ring.clear();
      const stateColor={idle:0x666666,walking:0x4CAF50,typing:0x2979FF,sitting:0xF5A623,waving:0xFF1D6C}[a.state]||0x666666;
      // Animated arc showing activity
      const arcLen=a.state==='typing'?Math.PI*1.5:a.state==='walking'?Math.PI:a.state==='waving'?Math.PI*2:Math.PI*0.5;
      const arcStart=time*3+a.bob;
      a.ring.arc(0,-6,14,arcStart,arcStart+arcLen).stroke({color:stateColor,alpha:0.6,width:2});
      // State icon
      a.roleText.text=a.state==='typing'?'coding...':a.state==='walking'?'moving':a.state==='sitting'?'resting':a.state==='waving'?'waving':AR[a.agentName]||'';
    }

    // Gentle float
    const bob=a.state==='walking'?Math.sin(a.frame*0.3)*2:Math.sin(time*2+a.bob)*1;
    a.gfx.y=bob;if(a.ring)a.ring.y=bob;

    // Shadow
    a.sh.clear();a.sh.ellipse(0,28,a.state==='walking'?12:10,a.state==='walking'?2:3).fill({color:0,alpha:0.12});

    // Code screen
    if(a.state==='typing'&&!a.codeScreen)addCodeScreen(a);
    if(a.state!=='typing'&&a.codeScreen){a.removeChild(a.codeScreen);a.codeScreen=null}
    if(a.codeScreen){a.codeTimer-=dt;if(a.codeTimer<=0){a.removeChild(a.codeScreen);a.codeScreen=null;addCodeScreen(a)}}

    // Walking dust
    if(a.state==='walking'&&Math.random()>0.92)particles.push(new P(a.x,a.y+8,0x888888,(Math.random()-.5)*.3,.2,15,1));
    // Typing sparks
    if(a.state==='typing'&&Math.random()>0.88)particles.push(new P(a.x+a.dir*15+(Math.random()-.5)*10,a.y-8,a.color,0,-.5,20,1));

    // Keep consistent scale (circles don't flip)
    a.zIndex=Math.floor(a.y);
  });

  // Face each other when close
  for(let i=0;i<agents.length;i++)for(let j=i+1;j<agents.length;j++){
    const a=agents[i],b=agents[j],d=Math.abs(a.x-b.x);
    if(d<60&&d>15&&a.state!=='walking'&&b.state!=='walking'){a.dir=b.x>a.x?1:-1;b.dir=a.x>b.x?1:-1}
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--)if(!particles[i].update(dt))particles.splice(i,1);

  // Floor particles
  if(Math.random()>0.95){
    const fid=FLOORS[currentFloor].id;
    if(fid==='f7')burst(Math.random()*app.screen.width,app.screen.height*0.2,0x4CAF50,1,app.screen.width);
    if(fid==='f9')burst(app.screen.width*0.5,app.screen.height*0.35,0x9C27B0,2,150);
    if(fid==='rooftop')particles.push(new P(0,Math.random()*app.screen.height*0.5,0xFFFFFF,2.5,0.2,80,1));
    if(fid==='f1'&&Math.random()>0.5)burst(Math.random()*app.screen.width,app.screen.height*0.6,0xFFFFDD,1,30);
    if(fid==='f6')burst(app.screen.width*0.3,app.screen.height*0.5,0xFF8800,2,15);
    if(fid==='b1')particles.push(new P(app.screen.width*0.15,app.screen.height*0.15,0xCCCCCC,(Math.random()-.5)*.3,-.8,40,1.5));
  }

  app.stage.sortChildren();
  updatePanel();
}

}
