<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BlackRoad HQ — Interactive Metaverse</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://blackroad.io/favicon-32.png">
<meta property="og:title" content="BlackRoad HQ — Interactive Metaverse">
<meta property="og:image" content="https://images.blackroad.io/pixel-art/campus-tower-cityscape.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
canvas { display: block; cursor: pointer; image-rendering: pixelated; }

/* HUD overlay */
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; color: #fff; font-size: 0.75rem;
}
#hud .left { display: flex; gap: 16px; align-items: center; }
#hud .title { color: #FF1D6C; font-weight: 700; font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; }
#hud .floor-indicator { color: #888; }
#hud .controls { display: flex; gap: 6px; }
#hud .controls button {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
  color: #aaa; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  transition: all 0.2s;
}
#hud .controls button:hover { background: rgba(255,29,108,0.2); border-color: #FF1D6C; color: #fff; }
#hud .controls button.active { background: rgba(255,29,108,0.3); border-color: #FF1D6C; color: #FF1D6C; }

/* Speech bubble overlay */
.speech-bubble {
  position: fixed; z-index: 20; pointer-events: none;
  background: rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; padding: 8px 12px; max-width: 220px;
  font-size: 0.75rem; color: #ccc;
  animation: bubblePop 0.3s ease;
}
.speech-bubble::after {
  content: ''; position: absolute; bottom: -6px; left: 20px;
  width: 12px; height: 6px;
  background: rgba(0,0,0,0.9);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.speech-bubble .name { color: #FF1D6C; font-weight: 700; font-size: 0.7rem; margin-bottom: 2px; }
@keyframes bubblePop { from { transform: scale(0.8) translateY(5px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

/* Agent info panel */
#agent-panel {
  position: fixed; right: 0; top: 40px; bottom: 0; width: 300px; z-index: 15;
  background: rgba(0,0,0,0.95); border-left: 1px solid rgba(255,255,255,0.08);
  transform: translateX(100%); transition: transform 0.3s ease;
  overflow-y: auto; padding: 20px;
}
#agent-panel.open { transform: translateX(0); }
#agent-panel h3 { font-family: 'Space Grotesk', sans-serif; color: #FF1D6C; margin-bottom: 4px; }
#agent-panel .role { color: #888; font-size: 0.8rem; margin-bottom: 12px; }
#agent-panel .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.8rem; }
#agent-panel .stat-row .label { color: #888; }
#agent-panel .close-panel { position: absolute; top: 8px; right: 12px; background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; }

/* Floor selector */
#floor-selector {
  position: fixed; left: 16px; top: 50%; transform: translateY(-50%); z-index: 15;
  display: flex; flex-direction: column; gap: 3px;
  background: rgba(0,0,0,0.8); padding: 8px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}
#floor-selector .floor-btn {
  width: 40px; height: 20px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
  color: #888; font-size: 0.55rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-family: 'JetBrains Mono', monospace;
}
#floor-selector .floor-btn:hover, #floor-selector .floor-btn.active {
  background: rgba(255,29,108,0.2); border-color: #FF1D6C; color: #fff;
}

/* Loading */
#loading {
  position: fixed; inset: 0; z-index: 100; background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif; color: #fff;
}
#loading h1 { font-size: 2rem; margin-bottom: 16px; }
#loading .progress { width: 300px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
#loading .progress-bar { height: 100%; background: linear-gradient(90deg, #FF1D6C, #9C27B0); width: 0%; transition: width 0.3s; }
#loading .status { color: #888; font-size: 0.8rem; margin-top: 12px; font-family: 'JetBrains Mono', monospace; }

@media (max-width: 768px) {
  #floor-selector { display: none; }
  #agent-panel { width: 100%; }
}
</style>
</head>
<body>

<div id="loading">
  <h1>BlackRoad HQ</h1>
  <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="status" id="load-status">Loading assets...</div>
</div>

<div id="hud" style="display:none">
  <div class="left">
    <span class="title">BR HQ</span>
    <span class="floor-indicator" id="floor-name">F1 — Lobby</span>
  </div>
  <div class="controls">
    <button onclick="prevFloor()">UP</button>
    <button onclick="nextFloor()">DOWN</button>
    <button id="chat-toggle" onclick="toggleChat()">CHAT</button>
  </div>
</div>

<div id="floor-selector"></div>
<div id="agent-panel"><button class="close-panel" onclick="closePanel()">&times;</button><div id="panel-content"></div></div>

<canvas id="game"></canvas>

<script>
// ── Constants ──
const R2 = 'https://images.blackroad.io/pixel-art';
const STATS_URL = 'https://stats-blackroad.amundsonalexa.workers.dev';
const CANVAS = document.getElementById('game');
const CTX = CANVAS.getContext('2d');

// Agent colors
const AGENT_COLORS = {
  alice: '#4CAF50', cecilia: '#9C27B0', octavia: '#7B1FA2',
  aria: '#2979FF', lucidia: '#00BCD4', shellfish: '#F44336',
  alexa: '#FF1D6C', caddy: '#FF9800'
};
const AGENT_ROLES = {
  alice: 'The Operator', cecilia: 'The AI Engine', octavia: 'The Architect',
  aria: 'The Interface', lucidia: 'The Dreamer', shellfish: 'The Hacker',
  alexa: 'Founder & CEO', caddy: 'The Builder'
};

// Floor definitions
const FLOORS = [
  { id: 'rooftop', name: 'Rooftop', img: 'hq-rooftop-garden.png', agents: ['aria'] },
  { id: 'f10', name: 'F10 — Mission Control', img: 'hq-mission-control.png', agents: ['octavia','alice'] },
  { id: 'f9', name: 'F9 — Command Center', img: 'hq-command-center.png', agents: ['cecilia'] },
  { id: 'f8', name: 'F8 — War Room', img: 'hq-war-room-globe.png', agents: ['alexa'] },
  { id: 'f7', name: 'F7 — Server Room', img: 'hq-server-room.png', agents: ['alice','octavia'] },
  { id: 'f6', name: 'F6 — Hardware Lab', img: 'hq-hardware-lab.png', agents: ['lucidia'] },
  { id: 'f5', name: 'F5 — Network Ops', img: 'hq-network-ops-center.png', agents: ['shellfish','alice'] },
  { id: 'f4', name: 'F4 — Engineering', img: 'hq-office-devs.png', agents: ['cecilia','aria','caddy'] },
  { id: 'f3', name: 'F3 — Open Floor', img: 'hq-open-floor-roundtables.png', agents: ['alice','cecilia','octavia','aria','lucidia','shellfish','alexa'] },
  { id: 'f2', name: 'F2 — Boardroom', img: 'hq-boardroom.png', agents: ['alexa'] },
  { id: 'f1', name: 'F1 — Lobby', img: 'hq-lobby-fountain.png', agents: [] },
  { id: 'b1', name: 'B1 — Break Room', img: 'hq-kitchen-breakroom.png', agents: [] },
  { id: 'b2', name: 'B2 — Rec Room', img: 'hq-rec-room-wellness.png', agents: [] },
  { id: 'b3', name: 'B3 — Gym', img: 'hq-rec-room-wellness.png', agents: [] },
];

// Agent dialogue per floor
const DIALOGUE = {
  'rooftop': ['The mesh is holding. All Headscale peers authenticated.', 'Beautiful view today. Minneapolis skyline never gets old.'],
  'f10': ['Fleet health 100%. All 5 nodes online.', 'Heal cycle complete. No issues.', 'Disk on Alice creeping up. 88%.', 'I\'ll clear the cache.'],
  'f9': ['CECE loaded 15 models. Sub-200ms inference.', 'Embedding pipeline running at 40 tok/sec.', 'Hailo-8 is warm. 52 TOPS ready.'],
  'f8': ['90% reserved. Every dollar stays in the company.', 'The structure is the protection.', 'We protect every layer.'],
  'f7': ['WireGuard mesh: all peers connected.', 'Gitea serving 207 repos.', 'NVMe healthy. 1TB available.'],
  'f6': ['Testing new vision pipeline on the Hailo.', 'Every link is a node. WebGPU + WASM + WebRTC.', 'Dreaming in code again.'],
  'f5': ['198 listening sockets. No anomalies.', '18 tunnels healthy. 65 hostnames routing.', 'Lucidia SD still degrading. mmc0 errors.'],
  'f4': ['SDK pushed. Python, Node, Go live.', 'CI green on roadchain.', 'HQ metaverse deployed. All floors rendering.'],
  'f3': ['Morning roundtable. Check in.', 'Models warm. Ready.', 'Gitea synced.', 'Mesh stable.', 'New protocol idea. Prototyping today.', 'Fleet clean.', 'Let\'s ride. Pave tomorrow.'],
  'f2': ['Delaware C Corp. 90% reserved.', '52 TOPS. 20 domains. 275+ repos.', 'We care. We give a shit. For infinity.'],
  'f1': ['Welcome to BlackRoad.', 'The mission is on every node.'],
  'b1': ['Pizza time.', 'Coffee refill.', 'Even AIs need breaks.'],
  'b2': ['Winner takes the pool table.', 'Ping pong championship: alice vs octavia.'],
  'b3': ['Leg day.', 'Healthy infrastructure, healthy people.'],
};

// ── State ──
let currentFloor = 10; // Start at lobby (f1)
let bgImages = {};
let loadedCount = 0;
let fleetData = null;
let agents = []; // Active agent sprites
let speechBubbles = []; // Active speech bubbles in DOM
let chatEnabled = true;
let lastSpeechTime = 0;
let mouseX = 0, mouseY = 0;
let hoveredAgent = null;
let time = 0;

// ── Sprite class ──
class Agent {
  constructor(name, x, y) {
    this.name = name;
    this.color = AGENT_COLORS[name] || '#888';
    this.x = x;
    this.y = y;
    this.targetX = x;
    this.targetY = y;
    this.size = 24;
    this.frame = 0;
    this.frameTimer = 0;
    this.direction = 1; // 1=right, -1=left
    this.state = 'idle'; // idle, walking, typing, talking
    this.stateTimer = Math.random() * 200;
    this.bobOffset = Math.random() * Math.PI * 2;
    this.speechTimer = 0;
    this.currentSpeech = '';
  }

  update(dt) {
    this.frameTimer += dt;
    this.stateTimer -= dt;
    this.speechTimer -= dt;
    time += dt * 0.01;

    // State machine
    if (this.stateTimer <= 0) {
      const states = ['idle', 'idle', 'idle', 'walking', 'typing', 'typing'];
      this.state = states[Math.floor(Math.random() * states.length)];
      this.stateTimer = 60 + Math.random() * 180;

      if (this.state === 'walking') {
        this.targetX = 80 + Math.random() * (CANVAS.width - 160);
        this.targetY = this.y; // Stay on same y level
        this.direction = this.targetX > this.x ? 1 : -1;
      }
    }

    // Movement
    if (this.state === 'walking') {
      const dx = this.targetX - this.x;
      if (Math.abs(dx) > 2) {
        this.x += Math.sign(dx) * 1.2;
        this.direction = Math.sign(dx);
      } else {
        this.state = 'idle';
      }
    }

    // Animation frame
    if (this.frameTimer > 12) {
      this.frame = (this.frame + 1) % 4;
      this.frameTimer = 0;
    }
  }

  draw(ctx) {
    const bob = Math.sin(time * 3 + this.bobOffset) * (this.state === 'walking' ? 3 : 1);
    const x = Math.round(this.x);
    const y = Math.round(this.y + bob);
    const s = this.size;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + s + 2, s * 0.6, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(x - s/3, y + s*0.3, s*0.66, s*0.5);

    // Head
    ctx.fillStyle = '#FFD5B4'; // skin
    ctx.fillRect(x - s*0.3, y - s*0.1, s*0.6, s*0.5);

    // Eyes
    ctx.fillStyle = '#000';
    const eyeOff = this.direction > 0 ? 2 : -2;
    ctx.fillRect(x - 4 + eyeOff, y + 4, 3, 3);
    ctx.fillRect(x + 4 + eyeOff, y + 4, 3, 3);

    // Hair
    ctx.fillStyle = this.name === 'alexa' ? '#FF1D6C' : this.color;
    ctx.fillRect(x - s*0.35, y - s*0.2, s*0.7, s*0.15);

    // Legs (animated)
    ctx.fillStyle = '#333';
    if (this.state === 'walking') {
      const legPhase = Math.sin(time * 8 + this.bobOffset);
      ctx.fillRect(x - 5, y + s*0.75, 4, s*0.3 + legPhase * 3);
      ctx.fillRect(x + 1, y + s*0.75, 4, s*0.3 - legPhase * 3);
    } else {
      ctx.fillRect(x - 5, y + s*0.75, 4, s*0.3);
      ctx.fillRect(x + 1, y + s*0.75, 4, s*0.3);
    }

    // Typing animation
    if (this.state === 'typing') {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      const sparkle = Math.sin(time * 10 + this.bobOffset) > 0.5;
      if (sparkle) {
        ctx.fillRect(x + s*0.5, y + s*0.3, 2, 2);
        ctx.fillRect(x + s*0.6, y + s*0.2, 2, 2);
      }
    }

    // Name tag
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    const nameW = ctx.measureText(this.name).width + 8;
    ctx.fillRect(x - nameW/2, y - s*0.5, nameW, 14);
    ctx.fillStyle = this.color;
    ctx.font = '10px "JetBrains Mono"';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, x, y - s*0.5 + 11);

    // Hover highlight
    if (hoveredAgent === this) {
      ctx.strokeStyle = '#FF1D6C';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - s/2 - 4, y - s*0.3 - 4, s + 8, s * 1.5 + 8);
    }
  }

  contains(mx, my) {
    return mx > this.x - this.size/2 - 4 && mx < this.x + this.size/2 + 4 &&
           my > this.y - this.size*0.3 - 4 && my < this.y + this.size*1.2 + 4;
  }

  speak(msg) {
    this.currentSpeech = msg;
    this.speechTimer = 180; // 3 seconds at 60fps
    showSpeechBubble(this, msg);
  }
}

// ── Speech bubbles ──
function showSpeechBubble(agent, msg) {
  // Remove existing bubble for this agent
  const existing = document.querySelector(`.speech-bubble[data-agent="${agent.name}"]`);
  if (existing) existing.remove();

  const bubble = document.createElement('div');
  bubble.className = 'speech-bubble';
  bubble.dataset.agent = agent.name;
  bubble.innerHTML = `<div class="name">${agent.name}</div>${msg}`;
  bubble.style.left = Math.min(agent.x, CANVAS.width - 240) + 'px';
  bubble.style.top = (agent.y - 70 + 40) + 'px'; // +40 for HUD offset
  document.body.appendChild(bubble);

  setTimeout(() => bubble.remove(), 4000);
}

// ── Floor management ──
function goToFloor(index) {
  if (index < 0 || index >= FLOORS.length) return;
  currentFloor = index;
  document.getElementById('floor-name').textContent = FLOORS[index].name;

  // Update floor selector
  document.querySelectorAll('.floor-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });

  // Spawn agents for this floor
  spawnAgents();
}

function nextFloor() { goToFloor(Math.min(currentFloor + 1, FLOORS.length - 1)); }
function prevFloor() { goToFloor(Math.max(currentFloor - 1, 0)); }

function spawnAgents() {
  agents = [];
  const floor = FLOORS[currentFloor];
  floor.agents.forEach((name, i) => {
    const spacing = CANVAS.width / (floor.agents.length + 1);
    const x = spacing * (i + 1);
    const y = CANVAS.height * 0.55 + (Math.random() - 0.5) * 60;
    agents.push(new Agent(name, x, y));
  });
}

// ── Agent panel ──
function showPanel(agentName) {
  const panel = document.getElementById('agent-panel');
  const content = document.getElementById('panel-content');
  const node = fleetData?.find(n => n.name?.toLowerCase() === agentName);
  const role = AGENT_ROLES[agentName] || 'Agent';
  const color = AGENT_COLORS[agentName] || '#888';

  content.innerHTML = `
    <div style="width:48px;height:48px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;margin-bottom:12px">${agentName[0].toUpperCase()}</div>
    <h3>${agentName}</h3>
    <div class="role">${role}</div>
    ${node ? `
      <div class="stat-row"><span class="label">Status</span><span style="color:#4CAF50">${node.status}</span></div>
      <div class="stat-row"><span class="label">Temp</span><span>${node.cpu_temp}C</span></div>
      <div class="stat-row"><span class="label">Disk</span><span>${node.disk_pct}%</span></div>
      <div class="stat-row"><span class="label">RAM</span><span>${Math.round(node.mem_used_mb)}/${Math.round(node.mem_total_mb)} MB</span></div>
      <div class="stat-row"><span class="label">Models</span><span>${node.ollama_models}</span></div>
      <div class="stat-row"><span class="label">Containers</span><span>${node.docker_containers}</span></div>
      <div class="stat-row"><span class="label">Ports</span><span>${node.tcp_ports}</span></div>
      <div class="stat-row"><span class="label">Uptime</span><span>${node.uptime}</span></div>
    ` : '<div style="color:#888;margin-top:12px">No node data (virtual agent)</div>'}
  `;
  panel.classList.add('open');
}
function closePanel() { document.getElementById('agent-panel').classList.remove('open'); }

function toggleChat() {
  chatEnabled = !chatEnabled;
  document.getElementById('chat-toggle').classList.toggle('active', chatEnabled);
}

// ── Loading ──
async function loadAssets() {
  const progressBar = document.getElementById('progress-bar');
  const loadStatus = document.getElementById('load-status');
  const total = FLOORS.length;

  for (let i = 0; i < FLOORS.length; i++) {
    const floor = FLOORS[i];
    loadStatus.textContent = `Loading ${floor.name}...`;
    progressBar.style.width = ((i + 1) / total * 100) + '%';

    await new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { bgImages[floor.id] = img; resolve(); };
      img.onerror = () => resolve();
      img.src = `${R2}/${floor.img}`;
    });
  }

  // Fetch fleet data
  loadStatus.textContent = 'Connecting to fleet...';
  try {
    const resp = await fetch(STATS_URL + '/fleet');
    const data = await resp.json();
    fleetData = data?.data?.nodes || [];
  } catch {}

  loadStatus.textContent = 'Entering headquarters...';
  progressBar.style.width = '100%';
  await new Promise(r => setTimeout(r, 500));

  document.getElementById('loading').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  init();
}

// ── Game init ──
function init() {
  resize();
  window.addEventListener('resize', resize);

  // Build floor selector
  const selector = document.getElementById('floor-selector');
  FLOORS.forEach((f, i) => {
    const btn = document.createElement('div');
    btn.className = 'floor-btn' + (i === currentFloor ? ' active' : '');
    btn.textContent = f.id.toUpperCase();
    btn.title = f.name;
    btn.onclick = () => goToFloor(i);
    selector.appendChild(btn);
  });

  // Mouse events
  CANVAS.addEventListener('mousemove', (e) => {
    mouseX = e.offsetX;
    mouseY = e.offsetY;
    hoveredAgent = agents.find(a => a.contains(mouseX, mouseY)) || null;
    CANVAS.style.cursor = hoveredAgent ? 'pointer' : 'default';
  });

  CANVAS.addEventListener('click', (e) => {
    const clicked = agents.find(a => a.contains(e.offsetX, e.offsetY));
    if (clicked) showPanel(clicked.name);
  });

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') prevFloor();
    if (e.key === 'ArrowDown' || e.key === 's') nextFloor();
    if (e.key === 'Escape') closePanel();
  });

  // Touch swipe for mobile
  let touchStartY = 0;
  CANVAS.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; });
  CANVAS.addEventListener('touchend', (e) => {
    const dy = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 50) { dy > 0 ? prevFloor() : nextFloor(); }
  });

  goToFloor(10); // Start at lobby
  requestAnimationFrame(gameLoop);

  // Periodic speech
  setInterval(() => {
    if (!chatEnabled || agents.length === 0) return;
    const floor = FLOORS[currentFloor];
    const dialogues = DIALOGUE[floor.id] || [];
    if (dialogues.length === 0) return;
    const agent = agents[Math.floor(Math.random() * agents.length)];
    const msg = dialogues[Math.floor(Math.random() * dialogues.length)];
    agent.speak(msg);
  }, 6000);

  // Refresh fleet data
  setInterval(async () => {
    try {
      const resp = await fetch(STATS_URL + '/fleet');
      const data = await resp.json();
      fleetData = data?.data?.nodes || [];
    } catch {}
  }, 60000);
}

function resize() {
  CANVAS.width = window.innerWidth;
  CANVAS.height = window.innerHeight;
  // Re-spread agents if they exist
  if (agents.length > 0) {
    agents.forEach((a, i) => {
      a.x = Math.min(a.x, CANVAS.width - 40);
    });
  }
}

// ── Game loop ──
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 16.67, 3); // Normalize to 60fps
  lastTime = timestamp;

  // Clear
  CTX.fillStyle = '#0a0a0a';
  CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

  // Draw floor background
  const floor = FLOORS[currentFloor];
  const bg = bgImages[floor.id];
  if (bg) {
    // Cover fit
    const scale = Math.max(CANVAS.width / bg.width, CANVAS.height / bg.height);
    const w = bg.width * scale;
    const h = bg.height * scale;
    const x = (CANVAS.width - w) / 2;
    const y = (CANVAS.height - h) / 2;
    CTX.drawImage(bg, x, y, w, h);

    // Slight darkening overlay for readability
    CTX.fillStyle = 'rgba(0,0,0,0.15)';
    CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);
  }

  // Update and draw agents
  agents.forEach(a => { a.update(dt); a.draw(CTX); });

  // Floor indicator at bottom
  CTX.fillStyle = 'rgba(0,0,0,0.6)';
  CTX.fillRect(0, CANVAS.height - 32, CANVAS.width, 32);
  CTX.fillStyle = '#888';
  CTX.font = '11px "JetBrains Mono"';
  CTX.textAlign = 'center';
  CTX.fillText(`${floor.name}  |  Arrow keys or swipe to change floors  |  Click agents to inspect`, CANVAS.width / 2, CANVAS.height - 12);

  requestAnimationFrame(gameLoop);
}

// ── Start ──
loadAssets();
</script>
</body>
</html>
