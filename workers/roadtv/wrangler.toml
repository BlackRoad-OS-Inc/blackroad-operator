name               = "blackroad-roadtv"
main               = "src/index.js"
compatibility_date = "2024-12-01"
account_id         = "848cf0b18d51e0170e0d1537aec3505a"

[vars]
INSTANCE = "blackroad-roadtv"
VERSION  = "3.0.0"

# Custom domain routing
routes = [
  { pattern = "tv.blackroad.io", custom_domain = true },
]

# D1 database — shared with wiki
[[d1_databases]]
binding       = "DB"
database_name = "blackroad-platform"
database_id   = "b8b0f098-5eb2-4a20-ac8e-d6851699b9e3"

# R2 bucket for video files
[[r2_buckets]]
binding     = "VIDEOS"
bucket_name = "blackroad-roadtv"

# Workers AI for live agent streams
[ai]
binding = "AI"
