name               = "blackroad-signup"
main               = "src/index.js"
compatibility_date = "2024-12-01"
account_id         = "848cf0b18d51e0170e0d1537aec3505a"

[vars]
INSTANCE = "blackroad-signup"
BLACKBOARD_URL = "https://blackboard.amundsonalexa.workers.dev"

# Uses the BlackBoard D1 for contacts + a dedicated users table
[[d1_databases]]
binding       = "DB"
database_name = "blackboard"
database_id   = "bcc78f33-b052-4cb2-bcfb-db5cd3c08472"

# KV for rate limiting signups
[[kv_namespaces]]
binding = "RATE"
id      = "43a338856e364cd396ced2be2d30ffe9"
