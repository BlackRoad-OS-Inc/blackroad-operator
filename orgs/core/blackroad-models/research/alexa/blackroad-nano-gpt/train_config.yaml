# BlackRoad NanoGPT Training Configuration — v5
# Scaled up for 156K files across entire home directory

# Model architecture — ~85M params (up from 21M)
model:
  vocab_size: 8192
  n_embd: 768
  n_head: 12
  n_layer: 8
  block_size: 1024
  dropout: 0.1

# Training
training:
  batch_size: 4
  gradient_accumulation_steps: 8
  max_epochs: 20
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  scheduler: cosine

# Data — pull from entire home directory (156K files)
data:
  train_path: data/train.bin
  val_path: data/val.bin
  meta_path: data/meta.json
  source_dir: /Users/alexa
  val_split: 0.1

# Tokenizer
tokenizer:
  vocab_size: 8192
  save_path: data/tokenizer.json

# Checkpointing
checkpointing:
  dir: checkpoints
  every_n_steps: 500
  keep_last_n: 5
  save_best: true

# Logging
logging:
  dir: logs
  log_every_n_steps: 10
  sample_every_n_steps: 1000
  sample_dir: samples
  sample_length: 256
  sample_temperature: 0.8
  sample_top_k: 50

# Evaluation
eval:
  every_n_steps: 250
  val_batches: 50

# Hardware (Apple M1 Metal Performance Shaders)
hardware:
  device: mps
  dtype: float32
  num_workers: 0
  pin_memory: false
