<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="https://images.blackroad.io/brand/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://images.blackroad.io/brand/blackroad-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://images.blackroad.io/brand/apple-touch-icon.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .logo {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(90deg, #FF9D00, #FF6B00, #FF0066, #FF006B, #D600AA, #7700FF, #0066FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: glow 3s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }
        .tagline {
            font-size: 1.25rem;
            color: #888;
            margin-bottom: 2rem;
        }
        .status {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            font-size: 0.875rem;
            color: #FF9D00;
        }
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #FF9D00;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
    </style>
  <script src="https://blackroad-mesh.amundsonalexa.workers.dev/mesh.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 class="logo">BlackRoad OS</h1>
        <p class="tagline">Infrastructure is loading...</p>
        <div class="status">
            <span class="pulse"></span>
            Coming Soon
        </div>
    </div>
