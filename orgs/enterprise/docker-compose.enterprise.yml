# BlackRoad Enterprise Platforms — Docker Compose for Octavia Swarm
# Deploy: docker stack deploy -c docker-compose.enterprise.yml blackroad-enterprise
# All platforms share the blackroad-net overlay network

version: '3.8'

networks:
  blackroad-net:
    external: true

volumes:
  n8n-data:
  activepieces-data:
  activepieces-db:
  huginn-data:
  prefect-data:
  temporal-data:

services:
  # ─── n8n: Visual Workflow Automation ───────────────────────────
  # UI: http://octavia:5678
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://n8n.blackroad.io/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=blackroad
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-BlackRoad2026}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-blackroad-n8n-encryption-key-2026}
      - GENERIC_TIMEZONE=America/Chicago
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - blackroad-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  # ─── Activepieces: Low-Code Automation ─────────────────────────
  # UI: http://octavia:8080
  activepieces:
    image: activepieces/activepieces:latest
    ports:
      - "8080:80"
    environment:
      - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY:-blackroad-activepieces-key-2026-32ch}
      - AP_JWT_SECRET=${AP_JWT_SECRET:-blackroad-activepieces-jwt-secret-2026}
      - AP_FRONTEND_URL=https://automation.blackroad.io
      - AP_POSTGRES_DATABASE=activepieces
      - AP_POSTGRES_HOST=activepieces-db
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=activepieces
      - AP_POSTGRES_PASSWORD=${AP_DB_PASSWORD:-blackroad2026}
      - AP_REDIS_HOST=localhost
      - AP_TELEMETRY_ENABLED=false
    depends_on:
      - activepieces-db
    networks:
      - blackroad-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G

  activepieces-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=activepieces
      - POSTGRES_USER=activepieces
      - POSTGRES_PASSWORD=${AP_DB_PASSWORD:-blackroad2026}
    volumes:
      - activepieces-db:/var/lib/postgresql/data
    networks:
      - blackroad-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  # ─── Huginn: Agent Automation ──────────────────────────────────
  # UI: http://octavia:3000
  huginn:
    image: ghcr.io/huginn/huginn:latest
    ports:
      - "3003:3000"
    environment:
      - DOMAIN=agents.blackroad.io
      - HUGINN_DATABASE_ADAPTER=sqlite3
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${HUGINN_SECRET:-blackroad-huginn-secret-key-base-2026-minimum-30-chars}
      - INVITATION_CODE=blackroad2026
    volumes:
      - huginn-data:/app/data
    networks:
      - blackroad-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  # ─── Prefect: Python Workflow Orchestration ────────────────────
  # UI: http://octavia:4200
  prefect:
    image: prefecthq/prefect:3-latest
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_URL=http://octavia:4200/api
    volumes:
      - prefect-data:/root/.prefect
    networks:
      - blackroad-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  # ─── Temporal: Distributed Workflow Engine ─────────────────────
  # UI: http://octavia:8233
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
      - TEMPORAL_ADDRESS=0.0.0.0:7233
    volumes:
      - temporal-data:/etc/temporal
    networks:
      - blackroad-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - blackroad-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
